<script>
/* 资产库体检（批4-3 修复）：GET /api/library/audit（只读报告）。打开体检若存在悬空/坏proj 引用 → 自动修正（后端 cleanup 先备份），不留手动"一键修正"按钮。
   不做删除、不做重复合并；孤儿仅列示（删卡由资产库页）；删除由资产库页完成。 */
let auditData = null;
const A_KIND = { characters: '人物', scenes: '场景', props: '道具' };
// ①批4-3修复：体检索条目无图/加载失败 → 按 kind 显示占位图标（不再空白/破图）
function kindGlyph(kind) { return { characters: '👤', scenes: '🏙️', props: '🎭' }[kind] || '🖼️'; }
function auditGlyphSpan(kind) { return '<span class="audit-glyph">' + kindGlyph(kind) + '</span>'; }

// 第6批 item4：加载资产页自动跑体检 + 顶部轻量汇总（静默，不弹窗）。
//   ①引用计数全量核对自动修正（/assets/index/recount，以扫描为准，修正入日志）
//   ②读 /library/audit 孤儿/悬空数（悬空/坏proj 的自动修正保留在 openAudit 打开时触发，避免页面每次加载都写库）
//   ③读未分类列表算"Z 张(其中 W 张可安全删除)"
function runAutoAudit() {
  var el = document.getElementById('audit-summary');
  if (!el) return;
  Promise.all([
    api('/assets/index/recount').catch(function () { return { scanned: 0, fixed: 0 }; }),
    api('/library/audit').catch(function () { return { issues: { orphans: { count: 0 }, dangling_episodes: { count: 0 }, bad_project_refs: { count: 0 } } }; }),
    api('/assets/index/unclassified').catch(function () { return { entries: [] }; })
  ]).then(function (rs) {
    var recount = rs[0], audit = rs[1], uc = rs[2];
    var orph = ((audit.issues || {}).orphans || {}).count || 0;
    var dang = ((audit.issues || {}).dangling_episodes || {}).count || 0;
    var badp = ((audit.issues || {}).bad_project_refs || {}).count || 0;   // §十四D4：坏项目引用为 0 也显式显示
    var entries = (uc.entries || []);
    var safeDel = entries.filter(function (e) { return (e.ref_count || 0) === 0; }).length;
    var allOk = orph === 0 && dang === 0 && badp === 0 && (recount.fixed || 0) === 0;
    el.style.display = 'block';
    el.classList.remove('a-ok', 'a-warn');
    el.classList.add(allOk ? 'a-ok' : 'a-warn');
    el.innerHTML = (allOk ? '✅' : '🔎') + ' 体检完成：孤儿<b>' + orph + '</b>个 / 悬空<b>' + dang +
      '</b>个 / <b>坏项目引用 ' + badp + '</b>个 / 未分类<b>' + entries.length + '</b>张（其中<b style="color:var(--ss-success)">' + safeDel + '</b>张引用为0·可安全删除）' +
      (recount.fixed ? '｜引用计数已自动修正 <b>' + recount.fixed + '</b> 项' : '') +
      ' <button class="btn-ghost btn-mini" style="float:right" onclick="openAudit()">查看详情</button>';
    if (window.console && (recount.fixed || 0) > 0) console.log('[assets-auto-audit] 引用计数自动修正 ' + recount.fixed + ' 项（静默，见 /api/assets/index/recount）');
  }).catch(function () { /* 体检失败不打扰页面 */ });
}

function openAudit() {
  document.getElementById('audit-mask').style.display = 'flex';
  const resBox = document.getElementById('audit-result');
  resBox.style.display = 'none';
  resBox.style.background = '#F0F4F1'; resBox.style.borderColor = '#BCD2C7';
  document.getElementById('audit-body').innerHTML = '<div class="empty" style="padding:20px">体检中……</div>';
  // 先扫一次看是否有可自动修正的悬空/坏proj
  api('/library/audit').then(function (d) {
    const n = (((d.issues || {}).dangling_episodes || {}).items || []).length
      + (((d.issues || {}).bad_project_refs || {}).items || []).length;
    if (n > 0) { autoFixAudit(d); return; }   // 自动修正后重扫展示
    auditData = d;
    renderAudit();
  }).catch(function (e) { document.getElementById('audit-body').innerHTML = '<div class="empty">体检失败：' + esc(e.message || e) + '</div>'; });
}
// 打开体检自动修正悬空/坏proj 引用（后端先整体备份三库；不删孤儿、不合并）
function autoFixAudit(d) {
  const body = { actions: { fix_dangling: [], fix_bad_proj: [] } };
  ((d.issues && d.issues.dangling_episodes || {}).items || []).forEach(function (it) {
    body.actions.fix_dangling.push({ id: it.id, drop_episodes: it.dangling_episodes || [], drop_scenes: it.dangling_scenes || [] });
  });
  ((d.issues && d.issues.bad_project_refs || {}).items || []).forEach(function (it) {
    body.actions.fix_bad_proj.push({ id: it.id, drop_projects: it.bad_projects || [] });
  });
  api('/library/audit/cleanup', jsonBody('POST', body)).then(function (res) {
    const box = document.getElementById('audit-result');
    box.style.display = 'block';
    let s = '✅ 已自动修正悬空/坏项目引用\n备份目录：data/' + (res.backup_path || '-') + '\n';
    const ap = res.applied || {};
    s += '修正悬空引用 ' + (ap.fix_dangling || 0) + ' 项｜修正坏项目引用 ' + (ap.fix_bad_proj || 0) + ' 项\n';
    if ((res.errors || []).length) { s += '⚠️ ' + res.errors.length + ' 项未执行：\n' + res.errors.map(function (e) { return ' - [' + (e.id || e.op) + '] ' + e.reason; }).join('\n'); }
    box.textContent = s;
    box.style.background = '#F0F4F1'; box.style.borderColor = '#BCD2C7';
    // 重扫，展示修正后健康度
    api('/library/audit').then(function (d2) { auditData = d2; renderAudit(); })
      .catch(function (e) { document.getElementById('audit-body').innerHTML = '<div class="empty">重扫失败：' + esc(e.message || e) + '</div>'; });
  }).catch(function (e) {
    const box = document.getElementById('audit-result');
    box.style.display = 'block';
    box.textContent = '自动修正失败：' + (e.detail && e.detail.msg ? e.detail.msg : (e.message || e));
    box.style.background = '#fee2e2'; box.style.borderColor = '#fecaca';
    auditData = d; renderAudit();
  });
}
function closeAudit() { document.getElementById('audit-mask').style.display = 'none'; auditData = null; }
function auditName(it) { return (it.name || '') + (it.variant_name && it.variant_name !== '基础形象' ? '-' + it.variant_name : ''); }

function renderAudit() {
  const d = auditData;
  const snap = document.getElementById('audit-snapshot');
  snap.innerHTML = '在案项目 <b>' + d.scope.valid_projects_count + '</b> 个 / 有效集 <b>' + d.scope.valid_episodes +
    '</b> / 有效场 <b>' + d.scope.valid_scenes + '</b>；三库资产 人物<b>' + (d.library.characters || 0) +
    '</b> / 场景<b>' + (d.library.scenes || 0) + '</b> / 道具<b>' + (d.library.props || 0) +
    '</b>。巡检时间：' + d.generated_at.replace('T', ' ') +
    '。本报告只读；<b>删除请在资产库页自行操作</b>（被引用的卡片会红框禁删）。点击任一项可跳转资产库定位对应卡片。';
  let html = '';

  // 通用问题行（图缩略 + 名称 + 跳转）。hover 悬浮大图预览，点击行/按钮跳转资产库定位闪烁。
  function issueRow(it, badge, desc) {
    // ①批4-3修复：有 thumb 渲染图（含悬浮大图预览），图加载失败由下方 error 绑定回退占位图标；无 thumb 直接占位图标
    let img;
    if (it.thumb) {
      const u = '/api/asset-file/' + encodeURIComponent(it.thumb);
      img = '<span class="audit-prev"><img class="audit-thumb" src="' + u + '" loading="lazy" alt="">' +
        '<img class="audit-prev-big" src="' + u + '" alt=""></span>';
    } else {
      img = '<span class="audit-prev">' + auditGlyphSpan(it.kind) + '</span>';
    }
    return '<div class="audit-row audit-item" data-kind="' + esc(it.kind) + '" data-id="' + esc(it.id) + '">' +
      img +
      '<div style="flex:1;min-width:0"><span class="audit-badge-mini">' + badge + '</span>' +
      '<b>' + esc(auditName(it)) + '</b> <span class="a-id">[' + esc(it.id) + ']</span>（' + (A_KIND[it.kind] || it.kind) + '）<br>' +
      '<span style="color:#6b7280">' + desc + '</span></div>' +
      '<button class="btn-ghost btn-mini" onclick="auditLocate(\'' + esc(it.kind) + '\',\'' + esc(it.id) + '\')">去资产库定位 ➜</button></div>';
  }

  // —— 孤儿资产（只读列示，不删；删卡由资产页完成） ——
  const orph = (d.issues.orphans || {}).items || [];
  html += '<div class="audit-sec"><h3><span class="audit-badge-orphan">孤儿资产 ' + orph.length + '</span>' +
    ' 无任何项目归属（历史测试/删除残留）。<b>体检不删</b>；如需删除请到资产库页（此类无引用可删）。</h3>';
  if (!orph.length) html += '<div class="audit-empty">无孤儿资产 ✓</div>';
  else orph.forEach(function (it) {
    html += issueRow(it, '孤儿', '无项目归属 · 资产库页可直接删除');
  });
  html += '</div>';

  // —— 悬空 eps/场 引用（打开体检自动修正） ——
  const dang = (d.issues.dangling_episodes || {}).items || [];
  html += '<div class="audit-sec"><h3><span class="audit-badge-dang">悬空引用 ' + dang.length + '</span>' +
    ' projects 在案但引用了已删除的集/场。打开体检即自动剔除悬空、保留项目与有效归属。</h3>';
  if (!dang.length) html += '<div class="audit-empty">无悬空引用 ✓</div>';
  else dang.forEach(function (it) {
    const dd = (it.dangling_episodes || []).concat(it.dangling_scenes || []).length;
    html += issueRow(it, '悬空引用', '自动剔除悬空 ' + dd + ' 个 · 保留项目 ' + (it.projects || []).length + ' 个');
  });
  html += '</div>';

  // —— 坏 project 引用（打开体检自动修正） ——
  const badp = (d.issues.bad_project_refs || {}).items || [];
  html += '<div class="audit-sec"><h3><span class="audit-badge-badp">坏项目引用 ' + badp.length + '</span> projects 指向不在案项目。打开体检即自动剔除坏引用。</h3>';
  if (!badp.length) html += '<div class="audit-empty">无坏项目引用 ✓</div>';
  else badp.forEach(function (it) {
    html += issueRow(it, '坏项目引用', '自动剔除坏引用 ' + (it.bad_projects || []).length + ' 个');
  });
  html += '</div>';

  document.getElementById('audit-body').innerHTML = html;
  // 整行点击跳转资产库（非按钮区）
  document.querySelectorAll('#audit-body .audit-item').forEach(function (row) {
    row.addEventListener('click', function (e) {
      if (e.target.closest('button')) return;   // 按钮自己处理
      auditLocate(row.getAttribute('data-kind'), row.getAttribute('data-id'));
    });
  });
  // ①批4-3修复：缩略图加载失败（文件缺失/404）→ 回退为 kind 占位图标，避免破图/空白
  document.querySelectorAll('#audit-body .audit-prev img.audit-thumb').forEach(function (im) {
    if (im.complete && im.naturalWidth === 0) im.outerHTML = auditGlyphSpan((im.closest('.audit-item') || {}).getAttribute ? im.closest('.audit-item').getAttribute('data-kind') : '');
    else im.addEventListener('error', function () {
      var it = im.closest('.audit-item'); var k = it ? it.getAttribute('data-kind') : '';
      im.outerHTML = auditGlyphSpan(k);
    });
  });
  // ①批4-3修复：悬浮大图预览改为 fixed 定位并限制在视口内，避免在滚动/弹窗容器内被裁切出界（靠近右/下沿自动反侧）
  document.querySelectorAll('#audit-body .audit-prev').forEach(function (prev) {
    var big = prev.querySelector('.audit-prev-big');
    if (!big) return;
    function placeBig(e) {
      var w = 200, h = 220;
      if (big.naturalWidth) w = Math.min(240, big.naturalWidth);
      if (big.naturalHeight) h = Math.min(280, big.naturalHeight);
      var x = e.clientX + 16, y = e.clientY + 12;
      if (x + w > window.innerWidth - 8) x = e.clientX - w - 16;
      if (y + h > window.innerHeight - 8) y = window.innerHeight - h - 8;
      if (x < 4) x = 4; if (y < 4) y = 4;
      big.style.position = 'fixed'; big.style.left = x + 'px'; big.style.top = y + 'px';
      big.style.width = w + 'px'; big.style.maxHeight = 'none'; big.style.display = 'block'; big.style.zIndex = 1000;
    }
    prev.addEventListener('mouseenter', placeBig);
    prev.addEventListener('mousemove', placeBig);
    prev.addEventListener('mouseleave', function () { big.style.display = 'none'; });
  });
  auditCount();
}
// 点击问题项 → 跳转资产库定位该卡片（红框闪烁 4s）。经 sessionStorage 标记，让目标页定位 IIFE 走 4s 红框分支。
function auditLocate(kind, id) {
  closeAudit();
  try { sessionStorage.setItem('ss_audit_flash', '1'); } catch (e) {}
  location.href = 'assets.html?tab=' + encodeURIComponent(kind) + '&id=' + encodeURIComponent(id);
}
function auditCount() {
  const d = auditData || {};
  const n = ((d.issues && d.issues.dangling_episodes || {}).items || []).length
    + ((d.issues && d.issues.bad_project_refs || {}).items || []).length;
  // ①孤儿仅列示；②悬空/坏proj 打开体检已自动修正，此处仅提示（无手动按钮）
  document.getElementById('audit-count').textContent =
    (n > 0 ? ('可自动修正（打开体检已执行）：' + n + ' 项') : '体检完成：孤儿（仅列示）/悬空/坏项目引用均已处理，无待手动修正项');
}
</script>
