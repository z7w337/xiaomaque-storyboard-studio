<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小麻雀脚本与分镜工坊 - 人物库/场景库/道具库</title>
<script src="/static/palette.js?v=1"></script>
<script src="/static/vendor/aspect.js?v=1"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { overflow-y: scroll; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--ss-bg); color: #333; display: flex; min-height: 100vh; }
  .main-wrap { flex: 1; min-width: 0; width: 100%; display: flex; flex-direction: column; }
  main { max-width: 1280px; margin: 20px auto; padding: 0 16px; width: 100%; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 8px 22px; border-radius: 8px; background: var(--ss-border); color: var(--ss-text-2); cursor: pointer; font-size: 14px; border: none; }
  .tab.active { background: var(--ss-green-600); color: #fff; }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  button { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: var(--ss-green-600); color: #fff; }
  .btn-primary:hover { background: var(--ss-green-700); }
  .btn-ghost { background: var(--ss-bg); color: var(--ss-text-2); border: 1px solid var(--ss-border); }
  .btn-ghost:hover { background: var(--ss-border); }
  .btn-danger { background: var(--ss-error-bg); color: var(--ss-error); }
  .btn-danger:hover { background: #fecaca; }
  .btn-mini { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  #groups { display: grid !important; grid-template-columns: repeat(auto-fill, 150px) !important; gap: 14px; justify-content: start; }
  /* v1.7 实施9: 覆盖 vendor .ac-thumb height:150px 固定,按 data-layout 设 3:4/16:9 */
  #groups [data-layout="portrait"] .ac-thumb { height: auto !important; aspect-ratio: 3/4; }
  #groups [data-layout="landscape"] { grid-column: span 2; }  /* v1.9 实施9: 场景卡宽加倍(span 2 列平铺, 150*2+gap≈314px) */
  .group .cards [data-layout="landscape"] { grid-column: span 2; }
  #groups [data-layout="landscape"] .ac-thumb { height: auto !important; aspect-ratio: 16/9; }
  #groups [data-layout="portrait"] .asset-card { aspect-ratio: 3/4; }
  #groups [data-layout="landscape"] .asset-card { aspect-ratio: 16/9; }
  /* v2.0 实施9: 场景卡图撑满无白框(贴边+信息行紧凑小字) */
  #groups [data-layout="landscape"] .asset-card { border: none; border-radius: 8px; background: var(--ss-bg); padding: 0; overflow: hidden; }
  #groups [data-layout="landscape"] .ac-thumb { border-radius: 0; margin-bottom: 0; background: var(--ss-bg); }
  #groups [data-layout="landscape"] .ac-body { padding: 4px 8px; font-size: 11px; }
  /* v2.1 实施9: 所有卡无白框图撑满(人物/道具/参考/未分类, 与场景一致) */
  #groups .asset-card { border: none; border-radius: 8px; background: var(--ss-bg); padding: 0; overflow: hidden; }
  #groups .ac-thumb { border-radius: 0; margin-bottom: 0; background: var(--ss-bg); }
  #groups .ac-body { padding: 4px 8px; font-size: 11px; }
  .group { background: #e9ecef; border: 1px solid var(--ss-border); border-radius: 12px; padding: 10px; }
  .group-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .group-head h3 { font-size: 14px; }
  .group .cards { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 10px; justify-content: start; }
  /* v1.55b：音色样本胶囊徽章（Qwen3-TTS 产物 role=voice_sample，蓝底白字） */
  .vs-badge { display: inline-block; background: var(--ss-green-600); color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 11px; font-weight: 600; margin-right: 4px; vertical-align: middle; line-height: 16px; }
  /* 6-13：资产保存校验——字段级阻断高亮（红框闪烁） */
  .va-invalid { box-shadow: 0 0 0 3px rgba(220,38,38,.45); border-radius: 8px; animation: va-flash 1s ease-in-out 3; }
  @keyframes va-flash { 0%,100% { box-shadow: 0 0 0 3px rgba(220,38,38,.45); } 50% { box-shadow: 0 0 0 6px rgba(220,38,38,.15); } }
  .va-invalid-label { color: var(--ss-error) !important; font-weight: 700; }
  /* §十四 B4②：音频阻断常驻错误红条（显示在音色卡顶部，明示哪条+原因+合格上限；保存可重复覆盖） */
  .va-errbar { display: block; margin: 2px 0 8px; padding: 8px 10px; border-radius: 8px; background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; font-size: 12.5px; line-height: 1.55; }
  .va-errbar b { font-weight: 700; }
  .va-errbar .va-sep { border-top: 1px dashed #fecaca; margin: 5px 0; }

  /* v1.55b：文本音色区 Qwen3-TTS 生成框 */
  .vs-sample-box { margin-top: 8px; border: 1px dashed var(--ss-green-200); border-radius: 8px; padding: 8px 10px; background: var(--ss-green-50); }
  .vs-sample-tip { font-size: 12px; color: var(--ss-green-700); margin-bottom: 6px; line-height: 1.6; }
  /* v1.55b：生成进度模态（遮罩+卡片+阶段+进度条+计时） */
  .vs-progress-card { background: var(--ss-card); border-radius: 16px; padding: 32px 40px; width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  /* ⓪-4 体验①（用户 01:1x 口径）：进度图标 = 品牌 logo 动图 —— 进行中用 logo-motion-loop.svg（循环脉动），
     完成瞬间切 logo-motion-once.svg（横线一次性生长）；品牌双色深浅主题通读，无需 ill-l/ill-d 双份。 */
  .vs-progress-icon { display: inline-block; }
  .vs-progress-icon img.prg-ill { width: 104px; height: 104px; object-fit: contain; display: block; margin: 0 auto; }
  .vs-progress-title { font-size: 16px; font-weight: 700; margin: 12px 0 4px; color: var(--ss-text-1); }
  .vs-progress-stage { font-size: 13px; color: var(--ss-text-3); margin-bottom: 14px; }
  .vs-progress-bar { height: 8px; border-radius: 4px; background: var(--ss-border); overflow: hidden; }
  .vs-progress-fill { height: 100%; width: 0%; background: var(--ss-green-600); transition: width .4s; border-radius: 4px; }
  .vs-progress-time { font-size: 12px; color: var(--ss-text-4); margin-top: 8px; }
  /* ② F5a（用户 09-21 口径）：模态「保留样式、改功能」——入队提示态（q-mode）：
     只留品牌动图 + 一句「已添加到队列中」，**隐藏进度条 / 阶段文字 / 计时 / 取消**（2.5s 自动消失，来不及点）。
     进度真相在队列页与图位占位，模态不再假装报进度。 */
  .vs-progress-card.q-mode .vs-progress-stage,
  .vs-progress-card.q-mode .vs-progress-bar,
  .vs-progress-card.q-mode .vs-progress-time,
  .vs-progress-card.q-mode #vs-progress-cancel { display: none !important; }
  .vs-progress-card.q-mode .vs-progress-title { margin: 14px 0 2px; font-size: 17px; }
  .vs-progress-card.q-mode .vs-progress-icon img.prg-ill { animation: qPulse 1.6s ease-in-out infinite; }
  @keyframes qPulse { 0%,100% { opacity: .82; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.03); } }
  /* ② F5a：生成中示意图（任何图位两态，用户口径「有底图=遮罩模糊；无底图=生成中动图」）
     —— 大动图居中（用户 09-21 反馈「角落小动图根本找不到」→ 放大到 52% 居中 + 呼吸动效）。 */
  .gen-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3; pointer-events: none; }
  .ac-thumb { position: relative; overflow: hidden; }   /* 占位层的定位上下文（原样式未声明 position） */
  .gen-ph img { width: 52%; height: 52%; object-fit: contain; animation: genBreathe 2.4s ease-in-out infinite; }
  @keyframes genBreathe { 0%,100% { opacity: .78; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
  .ac-thumb.gen-on .ac-img, .mp-main-img.gen-on img {
    filter: blur(8px) saturate(.7) brightness(.94); transform: scale(1.08);
  }
  /* ⓪-4 体验③④：前后对照滑轨（单图叠放 + 竖线跟随鼠标，线左原图/线右新图；点弹层外关闭；无滚动） */
  .cmp-modal { width: auto; max-width: 92vw; padding: 18px 22px 22px; }
  .cmp-hint { font-size: 12px; color: var(--ss-text-3); margin-bottom: 10px; }
  .cmp-wrap { position: relative; width: min(84vw, 66vh); max-height: 66vh; overflow: hidden; border-radius: 10px; cursor: ew-resize; user-select: none; background: var(--ss-bg); }
  .cmp-wrap img { display: block; width: 100%; height: auto; max-height: 66vh; object-fit: contain; pointer-events: none; }
  .cmp-wrap .cmp-before { position: absolute; inset: 0; clip-path: inset(0 50% 0 0); }
  .cmp-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: var(--ss-green-600); pointer-events: none; box-shadow: 0 0 6px rgba(0,0,0,.35); }
  .cmp-knob { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 3px 7px; border-radius: 99px; background: var(--ss-green-600); color: #fff; font-size: 11px; line-height: 1; white-space: nowrap; }
  /* v1.55e：左区底部一行 = 左下"上传主图素材" + 右下"音色卡" */
  .meta-left-bottom { display: flex; gap: 8px; margin-top: 10px; align-items: flex-start; justify-content: space-between; flex-shrink: 0; }
  .meta-left-bottom .upload-drop { position: relative !important; flex: 0 0 auto; min-width: 0; display: inline-block; bottom: auto; left: auto; right: auto; background: transparent; z-index: auto; }  /* v1.55k+P0-1i：上传按钮左下角（不撑满不拉伸）；position:relative 使内部 .menu(absolute) 以按钮为锚弹出（nav.js 全局 .upload-drop absolute 规则已被本规则覆盖，修复菜单出界到图片区顶部的问题） */
  #meta-voice-prev { width: 120px; flex-shrink: 0; }  /* v1.55h：音色卡固定 120px（不撑满） */
  /* v1.55j：音色卡四角图标化——历史🕘左下 / 下载⬇右下（absolute 定位，纯图标） */
  .mp-voice-card { display: flex; flex-direction: column; padding: 8px 6px; gap: 6px; min-height: 130px; border: 1px solid var(--ss-green-300); border-radius: 10px; background: var(--ss-green-100); box-shadow: 0 1px 3px rgba(58,107,87,.12); position: relative; }
  .mp-voice-card.empty { color: var(--ss-text-4); font-size: 11px; text-align: center; padding: 14px 6px; background: var(--ss-bg); border-color: var(--ss-border); box-shadow: none; position: static; }
  .mp-voice-head { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; }
  .mp-voice-name { display: none; }
  .mp-voice-cur { color: var(--ss-success); font-weight: 700; font-size: 9px; }
  .mp-voice-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
  .mp-voice-play { width: 36px; height: 36px; border-radius: 50%; border: none; background: var(--ss-green-600); color: #fff; font-size: 15px; cursor: pointer; line-height: 1; padding: 0; box-shadow: 0 2px 6px rgba(58,107,87,.35); }
  .mp-voice-play.playing { background: var(--ss-success); box-shadow: 0 2px 6px rgba(22,163,74,.35); }
  .mp-voice-mini { position: absolute; bottom: 5px; left: 5px; right: 5px; display: flex; justify-content: space-between; font-size: 13px; padding: 0; }
  .mp-voice-mini button, .mp-voice-mini a { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--ss-green-600); border: none; background: none; cursor: pointer; text-decoration: none; font-size: 13px; padding: 0; line-height: 1; }
  .mp-voice-mini button:hover, .mp-voice-mini a:hover { background: rgba(58,107,87,.12); }
  /* v1.55e：音色历史弹窗（纯音频，平铺卡片，点击切换当前有效） */
  .vh-grid { display: grid; grid-template-columns: 1fr; gap: 8px; max-height: 320px; overflow-y: auto; }
  .vh-card { border: 1px solid var(--ss-green-200); background: var(--ss-green-50); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
  .vh-card.cur { border-color: var(--ss-green-600); background: var(--ss-green-100); }
  .vh-card .vh-head { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .vh-card .vh-name { font-size: 12px; color: var(--ss-green-700); font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .vh-card audio { width: 100%; height: 32px; }
  /* v1.55e：三标签切换不抖动（音色卡内容区固定 min-height + 内部滚动） */
  #voice-card .field { min-height: 300px; overflow-y: auto; }
  /* v1.55e：标签内简版播放/暂停小圆钮（播放中其它按钮 disable，防多音频同播） */
  .m-audios-sub .audio-item .sub-play { width: 22px; height: 22px; border-radius: 50%; border: none; background: var(--ss-green-600); color: #fff; font-size: 11px; cursor: pointer; flex-shrink: 0; line-height: 1; padding: 0; }
  .m-audios-sub .audio-item .sub-play.playing { background: var(--ss-success); }
  .m-audios-sub .audio-item .sub-play:disabled { background: var(--ss-border-strong); cursor: not-allowed; }
  /* v1.55k：左区 flex column——主图撑满剩余高度（无空白），底部行固定（上传左下+音色卡右下） */
  .meta-left { display: flex; flex-direction: column; }
  #meta-versions { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .mp-main-img { flex: 1; min-height: 220px; width: 100%; border-radius: 8px; overflow: hidden; position: relative; background: var(--ss-bg); border: 1px solid var(--ss-border); }
  .mp-main-img img { width: 100%; height: 100%; object-fit: cover; display: block; position: absolute; inset: 0; }
  .mp-thumbs { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; flex-shrink: 0; }
  .mp-thumb { width: 56px; height: 74px; border-radius: 6px; overflow: hidden; position: relative; cursor: pointer; border: 2px solid transparent; background: var(--ss-bg); flex-shrink: 0; }
  .mp-thumb.cur { border-color: var(--ss-green-600); }
  .mp-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mp-thumb .n { position: absolute; bottom: 0; right: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 9px; padding: 0 3px; border-radius: 3px 0 0 0; line-height: 13px; }
  .mp-ver-title { font-size: 12px; font-weight: 700; color: var(--ss-text-2); margin-bottom: 6px; flex-shrink: 0; }
  .mp-versions .mp-ver-card { width: 100%; aspect-ratio: 3/4; position: relative; background: var(--ss-bg); border-radius: 8px; overflow: hidden; border: 1px solid var(--ss-border); }
  .mp-versions .mp-ver-card img { width: 100%; height: 100%; object-fit: cover; }
  .mp-ver-badge { position: absolute; top: 6px; left: 6px; background: var(--ss-green-600); color: #fff; font-size: 10px; border-radius: 4px; padding: 1px 6px; }
  .mp-ver-del { position: absolute; top: 4px; right: 4px; width: 18px; height: 18px; border: none; background: rgba(0,0,0,.4); color: #fff; border-radius: 50%; cursor: pointer; font-size: 12px; line-height: 1; }
  .mp-ver-zoom { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,.5); color: #fff; border-radius: 4px; padding: 1px 6px; text-decoration: none; font-size: 11px; }
  .ph-card { padding: 30px 12px; text-align: center; color: var(--ss-text-4); display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: center; }
  .ph-ic { font-size: 28px; }
  /* v1.55d：三标签内简版音频列表（条目 + 🔊 + 下载 + 删除，无完整播放条） */
  .m-audios-sub { margin-top: 6px; }
  .m-audios-sub .audio-item { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-bottom: 4px; padding: 4px 6px; background: var(--ss-bg); border-radius: 6px; }
  .m-audios-sub .audio-item .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ss-text-3); }
  .m-audios-sub .audio-item button, .m-audios-sub .audio-item a { color: var(--ss-green-600); border: none; background: none; cursor: pointer; text-decoration: none; font-size: 12px; padding: 0; white-space: nowrap; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, 150px); gap: 14px; justify-content: start; }
  .card { background: var(--ss-card); border: 1px solid var(--ss-border); border-radius: 12px; overflow: hidden; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.06); transition: box-shadow .15s; display: flex; flex-direction: column; min-width: 0; }
  .card:hover { box-shadow: 0 4px 12px rgba(0,0,0,.1); }
  .card-img { position: relative; width: 100%; flex: 1 1 auto; min-height: 180px; background: var(--ss-bg); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
  .card-img img { width: 100%; height: 100%; object-fit: cover; }
  .card-img .ph { color: var(--ss-text-4); font-size: 12px; text-align: center; line-height: 1.5; }
  /* 卡片四角统一（v1.4）：左上 :: 拖拽柄、右上角（上传选库）、右下 ⋯、点卡提示词 */
  .card .dl { position:absolute; top:8px; left:8px; width:26px; height:26px; border-radius:6px; background:rgba(17,24,39,.65); color:#fff; border:none; font-size:13px; line-height:26px; cursor:grab; display:flex; align-items:center; justify-content:center; z-index:3; }
  .card .dl:hover { background:rgba(17,24,39,.9); }
  .card .dl:active { cursor:grabbing; }
  .card.hidden-dl .dl { display:none; }
  .card .crt { position:absolute; top:8px; right:8px; background:rgba(17,24,39,.65); color:#fff; border:none; border-radius:50%; width:26px; height:26px; font-size:13px; line-height:26px; cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:3; }
  .card .crt:hover { background:rgba(17,24,39,.9); }
  .card-actions-menu { position:fixed; z-index:120; background:var(--ss-card); border:1px solid var(--ss-border); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.15); min-width:150px; display:none; }
  .card-actions-menu div { padding:8px 14px; font-size:13px; cursor:pointer; }
  .card-actions-menu div:hover { background:var(--ss-bg); }
  /* 归类选择器：扁平资产卡（图+名+四角·多选勾选） */
  .ub-card { position:relative; border:1px solid var(--ss-border); border-radius:10px; padding:6px; cursor:pointer; background:var(--ss-card); transition:border-color .12s, box-shadow .12s; }
  .ub-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .ub-card.sel { border-color:var(--ss-green-600); box-shadow:0 0 0 2px rgba(58,107,87,.15); }
  .ub-thumb { position:relative; width:100%; aspect-ratio:1; border-radius:8px; background:var(--ss-bg); overflow:hidden; display:flex; align-items:center; justify-content:center; }
  .ub-thumb img { width:100%; height:100%; object-fit:cover; }
  .ub-thumb .ph { color:var(--ss-text-4); font-size:11px; text-align:center; line-height:1.4; }
  .ub-name { font-size:12px; color:var(--ss-text-2); margin-top:6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ub-check { position:absolute; top:8px; right:8px; width:20px; height:20px; border-radius:50%; background:var(--ss-green-600); color:#fff; font-size:12px; line-height:20px; text-align:center; }
  .card .dl.dragging { opacity:.5; }
  .card-body { padding: 10px 12px 8px; }
  .card-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .card-sub { font-size: 11px; color: var(--ss-text-4); margin-bottom: 6px; }
  .card-foot { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-top: 1px solid var(--ss-bg); }
  .dots { width: 26px; height: 26px; border-radius: 50%; background: var(--ss-bg); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--ss-text-3); font-size: 16px; padding: 0; }
  .dots:hover { background: var(--ss-border); }
  .tag { font-size: 11px; background: var(--ss-bg); border-radius: 10px; padding: 1px 8px; color: var(--ss-text-3); }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 6px; }
  .empty { color: var(--ss-text-4); text-align: center; padding: 40px 0; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--ss-card); border-radius: 10px; width: 720px; max-width: 96vw; max-height: 92vh; overflow: auto; padding: 18px; position: relative; }
  .modal h2 { font-size: 16px; margin-bottom: 12px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; }
  #inline-tip, #modal-tip { display: none; padding: 8px 14px; border-radius: 8px; font-size: 13px; }
  #inline-tip { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 200; box-shadow: 0 2px 10px rgba(0,0,0,.18); margin: 0; }
  #modal-tip { position: absolute; top: 12px; right: 14px; z-index: 10; max-width: 70%; box-shadow: 0 2px 8px rgba(0,0,0,.12); margin: 0; }
  .ctx-menu { position: fixed; background: var(--ss-card); border: 1px solid var(--ss-border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.15); z-index: 100; min-width: 140px; display: none; }
  .ctx-menu div { padding: 8px 14px; font-size: 13px; cursor: pointer; }
  .ctx-menu div:hover { background: var(--ss-bg); }
  .ctx-menu div.danger { color: var(--ss-error); }
  .meta-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 18px; }
  .meta-left .main-prev { position: relative; width: 100%; height: 240px; background: var(--ss-bg); border-radius: 8px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; overflow: hidden; border: 1px solid var(--ss-border); }
  .meta-left .main-prev img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .meta-left .main-prev .ph { color: var(--ss-text-4); font-size: 13px; }
  .meta-left .main-tag { position: absolute; top: 8px; left: 8px; background: var(--ss-green-600); color: #fff; font-size: 11px; border-radius: 6px; padding: 2px 8px; }
  .pv-icon { position: absolute; width: 26px; height: 26px; border-radius: 8px; background: rgba(17,24,39,.65); color: #fff; border: none; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; text-decoration: none; }
  .pv-icon:hover { background: rgba(17,24,39,.9); }
  .pv-icon.tl { top: 8px; right: 8px; }
  .pv-icon.br { bottom: 8px; right: 8px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 13px; color: var(--ss-text-3); margin-bottom: 4px; }
  .field input, .field textarea, .field select { width: 100%; padding: 7px 9px; border: 1px solid var(--ss-border-strong); border-radius: 8px; font-size: 13px; font-family: inherit; }
  .field textarea { min-height: 54px; resize: vertical; line-height: 1.5; }
  .scope-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 4px; }
  .scope-search { flex: 1; min-width: 0; padding: 5px 8px; border: 1px solid var(--ss-border-strong); border-radius: 6px; font-size: 12px; }
  .scope-bar select { padding: 5px 8px; border: 1px solid var(--ss-border-strong); border-radius: 6px; font-size: 12px; min-width: 150px; }
  .scope-tag { display: inline-flex; align-items: center; gap: 4px; background: var(--ss-bg); border: 1px solid var(--ss-border); border-radius: 12px; padding: 2px 8px; font-size: 12px; color: var(--ss-text-2); }
  .scope-tag button { border: none; background: none; cursor: pointer; color: var(--ss-text-4); font-size: 13px; padding: 0 2px; }
  .scope-tag button:hover { color: var(--ss-error); }
  .radio-row { display: flex; gap: 16px; align-items: center; font-size: 13px; }
  .radio-row label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; }
  .vs-tabs { display: inline-flex; gap: 6px; background: var(--ss-bg); border-radius: 10px; padding: 4px; }
  .vs-tab { border: none; background: none; border-radius: 8px; padding: 6px 14px; font-size: 13px; color: var(--ss-text-3); cursor: pointer; }
  .vs-tab.active { background: var(--ss-card); color: var(--ss-text-1); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .audio-item { display: inline-flex; align-items: center; gap: 4px; background: var(--ss-bg); border-radius: 10px; padding: 2px 8px; font-size: 12px; margin: 0 6px 6px 0; }
  .audio-item audio { height: 26px; }
  .audio-item a { color: var(--ss-green-600); text-decoration: none; }
  .placeholder-btn { background: var(--ss-bg); color: var(--ss-text-4); border: 1px dashed var(--ss-border-strong); cursor: not-allowed; }
  .opts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .link-btn { background: none; border: none; color: var(--ss-green-600); font-size: 12px; cursor: pointer; padding: 0; text-decoration: underline; }
  .upload-drop { position: relative; display: inline-block; }
  .upload-drop .menu { position: absolute; bottom: 100%; left: 0; background: var(--ss-card); border: 1px solid var(--ss-border); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); z-index: 40; display: none; min-width: 130px; }
  .upload-drop .menu div { padding: 7px 12px; font-size: 12px; cursor: pointer; }
  .upload-drop .menu div:hover { background: var(--ss-bg); }

/* ===== 步4 深色覆盖：体检汇总条（浅色字面量保留在状态类里）===== */
#audit-summary.a-ok    { background: #f0fdf4; border: 1px solid #bbf7d0; }
#audit-summary.a-warn  { background: #fefce8; border: 1px solid #fde68a; }
[data-theme="dark"] #audit-summary.a-ok   { background: var(--ss-success-bg); border-color: #1d4a2c; }
[data-theme="dark"] #audit-summary.a-warn { background: var(--ss-warning-bg); border-color: var(--ss-warning-border); }
</style>
</head>
<body>
<aside id="sidebar"></aside>
<div class="card-actions-menu" id="card-actions-menu">
  <div onclick="cardUploadImage()">上传图片</div>
  <div onclick="cardBindFromLibrary()">从资产库选择</div>
</div>
<div class="main-wrap">
<main>
  <div class="tabs">
    <button class="tab active" id="tab-characters" onclick="switchTab('characters')">👤 人物库</button>
    <button class="tab" id="tab-scenes" onclick="switchTab('scenes')">🏙️ 场景库</button>
    <button class="tab" id="tab-props" onclick="switchTab('props')">🎭 道具库</button>
    <button class="tab" id="tab-material" onclick="switchTab('material')">🧩 素材</button>
    <button class="btn-ghost btn-mini" style="margin-left:auto" onclick="openAudit()" title="检查资产库的登记与磁盘文件是否一致，发现问题可一键修正">🔍 资产库体检</button>
  </div>
  <div id="inline-tip"></div>
  <div class="toolbar">
    <span id="lib-meta" style="font-size:13px;color:var(--ss-text-3)"></span>
    <span style="font-size:12px;color:var(--ss-text-4)">同一名称可细分多个形象 / 视角 / 场景</span>
    <button class="btn-primary" onclick="openMeta(null)">＋ 新建</button>
  </div>
  <!-- 第6批 item4：加载资产页自动跑体检 → 顶部轻量汇总（不弹窗）；计数核对自动修正静默入日志 -->
  <div id="audit-summary" style="display:none;font-size:12px;line-height:1.6;padding:6px 12px;border-radius:8px;margin-bottom:8px"></div>
  <div id="groups"><div class="empty">加载中……</div></div>
</main>

<!-- 统一提示词编辑器（生图/生视频共用）：由 static/prompt-editor.js 注入，复用参考《阶段6-统一提示词编辑器框架样板.md》 -->

<!-- v1.55e：音色历史弹窗（纯音频，无图；平铺卡片，点击切换当前有效音色） -->
<div id="vh-pop" style="position:fixed;z-index:510;display:none">
  <div style="background:var(--ss-card);border:1px solid var(--ss-green-200);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.22);padding:14px 16px;width:420px;max-width:92vw;overflow:auto">
    <h2 style="font-size:15px;font-weight:600;margin-bottom:8px">🎵 音色历史（点击卡片设为当前有效，保存后生效）</h2>
    <div id="vh-list" class="vh-grid"></div>
    <div class="modal-actions"><button class="btn-ghost" onclick="closeVoiceHist()">关闭</button></div>
  </div>
</div>

<!-- ①·步1 A1：动作迁移弹窗（技术名不落在界面上；产物=带声音的新视频，落库为参考类资产卡） -->
<div class="modal-mask" id="motion-mask" style="display:none">
  <div class="modal" style="width:780px">
    <h2 id="motion-title">动作迁移</h2>
    <div style="display:flex;gap:14px">
      <div style="flex:0 0 210px">
        <div style="margin-bottom:6px">
          <label style="font-size:12px">人物（要动起来的角色）</label>
          <select id="motion-char-sel" onchange="onMotionCharChange()" style="width:100%"></select>
        </div>
        <img id="motion-char" style="width:100%;border-radius:8px;border:1px solid var(--ss-border);display:block" alt="人物参考图">
        <div style="font-size:11px;color:var(--ss-text-4);margin-top:4px">人物参考图 = 该人物当前主图</div>
      </div>
      <div style="flex:1;min-width:0">
        <div style="margin-bottom:8px">
          <label style="font-size:12px">场景参考图</label>
          <select id="motion-scene" style="width:100%"></select>
        </div>
        <div style="margin-bottom:8px">
          <label style="font-size:12px">动作参考视频（mp4 / webm，≤200MB，2–15 秒，无需声音）</label>
          <input type="file" id="motion-file" accept="video/mp4,video/quicktime,video/webm" style="width:100%">
        </div>
        <div id="motion-fileinfo" style="font-size:11px;color:var(--ss-text-4);margin:-4px 0 8px">未选择视频</div>
        <div style="margin-bottom:8px">
          <label style="font-size:12px">动作描述（可修改）</label>
          <textarea id="motion-prompt" rows="4" style="width:100%"></textarea>
        </div>
        <div style="display:flex;gap:10px;align-items:center;margin-bottom:6px">
          <label style="font-size:12px">输出时长（秒）</label>
          <input type="number" id="motion-duration" min="2" max="15" step="0.5" value="5" style="width:90px">
        </div>
        <div style="display:flex;align-items:flex-start;gap:10px;min-height:20px">
          <div id="motion-status" style="font-size:12px;color:var(--ss-text-3);flex:1;white-space:pre-wrap"></div>
          <button class="btn-ghost btn-mini" id="motion-cancel-btn" style="display:none">取消生成</button>
        </div>
        <video id="motion-result" controls style="display:none;width:100%;border-radius:8px;margin-top:8px;background:#000"></video>
      </div>
    </div>
    <div style="text-align:right;margin-top:10px">
      <button class="btn-ghost btn-mini" onclick="closeMotion()">关闭</button>
      <button class="btn-ghost btn-mini" id="motion-go" onclick="startMotion()" style="background:var(--ss-accent,#2e7d54);color:#fff">开始生成</button>
    </div>
  </div>
</div>

<!-- 元数据编辑（双栏） -->
<div class="modal-mask" id="meta-mask">
  <div class="modal" style="width:980px">
    <h2 id="meta-title">资产信息</h2>
    <div class="meta-grid">
      <div class="meta-left">
<!-- v2 升级（⓪-2 步3/步4）：当前主图的动作入口「编辑 / ✨ 增强细节」均已接线（openEditForAsset / openEnhanceForAsset） -->
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px">
          <button class="btn-ghost btn-mini" onclick="openEditForAsset(editingId, this)" title="对着这张图说改什么就改什么">编辑</button>
          <button class="btn-ghost btn-mini" onclick="openEnhanceForAsset(editingId, this)" title="把当前主图的细节增强（不可逆，会保留原图）">✨ 增强细节</button>
          <!-- ⓪-4（用户 00:3x 口径）：动作迁移入口移至页顶导航栏（tab 行），此处移除——编辑器只保留对当前主图的操作 -->
          <span style="font-size:11px;color:var(--ss-text-4)">作用于当前主图（占位）</span>
        </div>
        <!-- v1.55e：图版本卡片墙（多版本平铺，点击切换主图；renderMetaVersions 渲染） -->
        <div class="mp-versions" id="meta-versions"></div>
        <!-- v1.55e：左区底部一行 = 左下"上传主图素材" + 右下"音色卡" -->
        <div class="meta-left-bottom">
          <div class="upload-drop">
            <button class="btn-ghost btn-mini" onclick="toggleDrop(this)">📤 上传主图素材 ▾</button>
            <div class="menu"><div onclick="uploadImageMeta()">上传图片</div><div onclick="openAssetPicker('meta')">从资产库选择</div></div>
          </div>
          <div id="meta-voice-prev"></div>
        </div>
      </div>
      <div class="meta-right">
        <div class="mp-card">
          <div class="mp-card-t">基本信息</div>
          <div class="scope-bar" style="margin-top:2px;align-items:flex-start">
            <div class="field" style="flex:1;margin-bottom:0"><label>名称</label><input id="m-prefix" list="prefix-list"><datalist id="prefix-list"></datalist></div>
            <div class="field" style="flex:1;margin-bottom:0"><label id="m-variant-label">形象</label><input id="m-variant" placeholder="如：18岁-衬衫（不含名称前缀）"></div>
          </div>
        </div>
        <div class="mp-card">
          <div class="mp-card-t">归属 · 归属明细</div>
          <div class="scope-bar" style="margin-top:2px">
            <span style="font-size:12px;color:var(--ss-text-3)">项目：</span>
            <select id="sc-proj" onchange="onProjChange()" style="flex:1;min-width:0"></select>
          </div>
          <div id="ep-multi-list" class="ep-multi"></div>
          <div class="scope-bar" style="margin-top:6px">
            <button class="btn-primary btn-mini" onclick="addScopeGroup()">＋ 添加</button>
            <button class="btn-mini btn-primary" onclick="aiRecommendScopes()" title="智能推荐（4-6 通用能力：规则+LLM 推荐归属，确认后生效）">✨ 智能推荐</button>
          </div>
          <div id="f-scopes" class="scope-groups"></div>
        </div>
        <div class="mp-card" id="voice-card">
          <div class="mp-card-t">音色</div>
          <div class="vs-tabs">
            <button type="button" class="vs-tab active" data-v="text" onclick="setVoiceSrc('text')">文本音色</button>
            <button type="button" class="vs-tab" data-v="audio" onclick="setVoiceSrc('audio')">音频音色（上传绑定）</button>
            <button type="button" class="vs-tab" data-v="edge" onclick="setVoiceSrc('edge')">预置音色（edge-tts）</button>
          </div>
          <!-- v1.55h 文本音色：label 行左=声音描述 / 右=AI优化+生成音色样本；下=textarea -->
          <div class="field" id="v-text">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
              <label style="margin-bottom:0">声音描述（文本音色）</label>
              <div style="display:flex;gap:4px">
                <button class="btn-ghost btn-mini" onclick="aiOptimizeVoice()">✨ AI 优化</button>
                <button type="button" class="btn-primary btn-mini" id="btn-voice-sample" onclick="genVoiceSample()" title="🎙 Qwen3-TTS：把描述固化为真实声音（约 15 秒），视频配音时人物声音一致性更好，可作 H3 音色克隆">🎙 生成音色样本</button>
              </div>
            </div>
            <textarea id="m-voice"></textarea>
            <div id="vs-sample-status" style="display:none;margin-top:4px;font-size:12px;color:var(--ss-green-600)"></div>
            <div class="m-audios-sub" id="m-audios-text"></div>
          </div>
          <!-- v1.55d 音频音色（上传绑定）：绑定 + 简版列表 -->
          <div class="field" id="v-audio" style="display:none">
            <label>绑定已有音频（保存后作为该资产参考音频）</label>
            <div class="scope-bar" style="margin-bottom:4px">
              <button class="btn-ghost btn-mini" onclick="uploadAudioMeta()" style="flex:1">📤 绑定已有音频</button>
            </div>
            <div class="m-audios-sub" id="m-audios-audio"></div>
          </div>
          <!-- v1.55g 预置音色（Edge-TTS）→ 生成音色样本（与文本音色设计一致：生成后 chip 可试听/下载/删除） -->
          <div class="field" id="v-edge" style="display:none">
            <label>预置音色（Edge-TTS）→ 生成音色样本</label>
            <div class="scope-bar" style="margin-bottom:4px">
              <select id="tts-voice" style="flex:1;min-width:0"></select>
              <button class="btn-ghost btn-mini" onclick="genTrial()">生成音色样本</button>
            </div>
            <div class="m-audios-sub" id="m-audios-edge"></div>
          </div>
        </div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeMeta()">取消</button>
      <button class="btn-primary" id="meta-save" onclick="saveMeta()">保存</button>
    </div>
  </div>
</div>

<!-- v1.55b：音色样本生成进度模态（遮罩+阶段+进度条+计时，防止用户等待着急） -->
<div class="modal-mask" id="vs-progress-mask" style="z-index:900;display:none">
  <div class="vs-progress-card">
    <div class="vs-progress-icon">
      <img class="prg-ill" id="prg-ill-img" src="/static/brand/logo-motion-loop.svg" alt="">
    </div>
    <div class="vs-progress-title" id="vs-progress-title">生成音色样本中…</div>
    <div class="vs-progress-stage" id="vs-progress-stage">提交工作流…</div>
    <div class="vs-progress-bar"><div class="vs-progress-fill" id="vs-progress-fill"></div></div>
    <div class="vs-progress-time" id="vs-progress-time">已耗时 0 秒</div>
    <button class="btn-ghost btn-mini" id="vs-progress-cancel" onclick="vsProgressCancel()" style="display:none;margin-top:12px">取消生成</button>
  </div>
</div>

<!-- ①·步3 A3：增强细节强度控件（用户 00:4x 口径：无提示词，仅强度滑块；默认 0.5 / 上限 0.7） -->
<div class="modal-mask" id="enhance-mask" style="z-index:760;display:none">
  <div class="modal" style="width:420px">
    <h2>增强细节</h2>
    <div style="font-size:12px;color:var(--ss-text-3);margin-bottom:14px;line-height:1.7">
      把当前主图的细节增强：变清晰、补纹理。不改变构图与内容；原图会保留在历史版本里。
    </div>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:6px">
      <span style="font-size:12px;flex:0 0 60px;color:var(--ss-text-2)">增强强度</span>
      <input type="range" id="enh-strength" min="0.05" max="0.7" step="0.05" value="0.5" style="flex:1"
             oninput="document.getElementById('enh-strength-v').textContent=(+this.value).toFixed(2)">
      <b id="enh-strength-v" style="min-width:38px;text-align:right;font-size:13px;color:var(--ss-text-1)">0.50</b>
    </div>
    <div style="text-align:right;margin-top:16px">
      <button class="btn-ghost btn-mini" onclick="closeEnhance()">取消</button>
      <button class="btn-primary btn-mini" id="enh-go" onclick="startEnhance()">开始增强</button>
    </div>
  </div>
</div>

<!-- 资产库图片选择（分类 tab + 资产卡列表，统一选图体验；v1.57：从平铺全部图片改为分类级联式资产卡选择） -->
<div class="modal-mask" id="picker-mask" style="z-index:730">
  <div class="modal" style="width:680px">
    <h2 id="picker-title">选择要绑定的图片</h2>
    <div id="picker-tabs" class="ub-kind-tabs" style="display:none;gap:6px;margin-bottom:12px"></div>
    <div id="picker-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;max-height:52vh;overflow:auto"></div>
    <div class="modal-actions"><button class="btn-ghost" onclick="closePicker()">关闭</button></div>
  </div>
</div>

<!-- 未分类归类选择器（级联：分类→资产卡片多选，v1.4） -->
<div class="modal-mask" id="unassign-bind-mask">
  <div class="modal" style="width:680px">
    <h2>归类到资产</h2>
    <div class="ub-kind-tabs" style="display:flex;gap:6px;margin-bottom:12px">
      <button class="tab ub-kind active" data-kind="characters" onclick="ubShowKind('characters')">人物</button>
      <button class="tab ub-kind" data-kind="scenes" onclick="ubShowKind('scenes')">场景</button>
      <button class="tab ub-kind" data-kind="props" onclick="ubShowKind('props')">道具</button>
    </div>
    <div id="ub-asset-list" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:52vh;overflow:auto"></div>
    <div id="ub-selected-tip" style="font-size:12px;color:var(--ss-text-3);margin-top:10px">已选 0 个资产</div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeUnassignedBind()">取消</button>
      <button class="btn-primary" id="ub-submit" onclick="ubSubmitBind()" disabled>提交归类</button>
    </div>
  </div>
</div>

<!-- 右键菜单 -->
<div class="ctx-menu" id="ctx-menu">
  <div id="ctx-item-del" onclick="ctxDelete()">删除</div>
  <div id="ctx-item-copy" onclick="ctxCopy()">复制图片</div>
  <div id="ctx-item-dup" onclick="ctxDuplicate()">创建副本</div>
</div>

<!-- 统一提示词编辑器（卡片下方锚定 popover，内嵌共享组件 prompt-editor.js v3） -->
<div id="pe-pop" style="position:fixed;z-index:500;display:none">
  <div id="pe-root" style="background:var(--ss-card);border:1px solid var(--ss-border);border-radius:14px;box-shadow:0 18px 44px rgba(0,0,0,.22);padding:14px 16px 10px;width:720px;max-width:92vw;max-height:60vh;overflow:auto"></div>
</div>

<script>
const API = '/api';
const KINDS = {
  characters: { label: '人物', variantLabel: '形象', idPrefix: 'ch_' },
  scenes: { label: '场景', variantLabel: '视角', idPrefix: 'sc_' },
  props: { label: '道具', variantLabel: '所在场景', idPrefix: 'pr_' }
};
let currentKind = 'characters';
// v1.2 阶段2（IC工作流工坊化-素材标签合并）："参考类+未分类"UI 合并为"素材"标签(material)。
//   底层数据结构不动——material 视图内参考类走 /references、未分类走 /assets/index/unclassified 各自照旧，
//   删除逻辑各自保留。isRefKind()/apiKindOf() 把 material 视同 references 语义，收敛散落的 kind 判断，防 /material 404。
function isRefKind(k) { k = k || currentKind; return k === 'reference' || k === 'unassigned' || k === 'material'; }
function apiKindOf(k) { k = k || currentKind; return isRefKind(k) ? 'references' : k; }
let peRefs = [];   // v1.53 参考类资产（@ 弹窗可选）
let editingId = null;          // 元数据当前编辑资产
let editingScopes = { projects: [], episodes: [], scenes: [] };   // v1.34 三层
let scopeTree = [];
let curProjId = '';   // v1.45/49 归属：当前项目（项目下拉始终可用）
let pendingEpSelection = { all: false, eps: [] };   // v1.48：当前项目待添加的集选择（"＋添加"=项目+所选集一并入）
let ttsVoices = [{ id: 'zh-CN-XiaoxiaoNeural', label: '晓晓' }];
let ctxAsset = null;           // 右键目标
let ctxKind = null;            // 右键目标分类（characters/scenes/props/reference）
let _refPrevKind = null;       // openRefMeta 前 currentKind（关闭 meta 后恢复标签视图）
let _refSeed = null;           // 裸图落地参考类：种子图相对路径（openRefMeta 用，保存 POST /api/references）

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function escAttr(s) { return String(s).replace(/'/g, "\\'"); }
function tip(text, type) {
  // v1.42：信息通知统一用全局悬浮 toast（nav.js window.toast），不再用 Inline（页面内嵌提示条）
  if (window.toast) { window.toast(text, type); return; }
  const el = document.getElementById('inline-tip');
  el.textContent = text;
  el.style.background = type === 'success' ? '#dcfce7' : '#fee2e2';
  el.style.color = type === 'success' ? '#16a34a' : '#dc2626';
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 3200);
}
async function api(path, options) {
  const resp = await fetch(API + path, options);
  if (!resp.ok) { let d = '请求失败'; try { d = (await resp.json()).detail || d; } catch (e) {}
    // 6-13：后端 fail-fast 校验的 400 detail 为 {msg, errors:{字段:[msg]}}，保留结构供字段级高亮
    if (typeof d === 'object' && d !== null) { const e = new Error(d.msg || '资产未保存'); e.detail = d; throw e; }
    throw new Error(d); }
  const warnings = resp.headers.get('X-Asset-Warnings'); // 6-13：软提示经 header 附带
  let data = null; try { data = await resp.json(); } catch (e) {}
  if (warnings) { try { data = data || {}; data._warnings = JSON.parse(warnings); } catch (e) {} }
  return data;
}
function jsonBody(method, body) { return { method, headers: { 'Content-Type': 'application/json; charset=utf-8' }, body: JSON.stringify(body) }; }

async function getAsset(id) {
  // reference/落地：端点用复数 references（currentKind 存单数 reference/unassigned）
  const apiKind = isRefKind(currentKind) ? 'references' : currentKind;
  return api('/' + apiKind + '/' + id);
}

function switchTab(kind) {
  currentKind = kind;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('tab-' + kind).classList.add('active');
  load();
}
async function load() {
  // 未分类标签：渲染未分类/未分配区（/api/assets/index/unassigned）
  if (currentKind === 'unassigned') { renderUnassigned(); return; }
  // 参考类标签（v1.53 参考类资产模型）：渲染参考引用类资产
  if (currentKind === 'reference') { renderReferences(); return; }
  // v1.2 阶段2：素材标签（material）= 参考类 + 未分类 混排（纯 UI 合并，数据/删除逻辑各自不变）
  if (currentKind === 'material') { renderMaterial(); return; }
  document.getElementById('lib-meta').textContent = KINDS[currentKind].label + '库';
  document.getElementById('m-variant-label').textContent = KINDS[currentKind].variantLabel + (currentKind === 'characters' ? '（默认"基础形象"）' : '');
  document.getElementById('voice-card').style.display = currentKind === 'characters' ? '' : 'none';
  try {
    const [data, stats] = await Promise.all([api('/' + currentKind), api('/ref-stats')]);
    window.__refStats = stats || {};   // 批4-3：全局缓存出场引用统计（供禁删判断/卡片标注）
    renderGroups(data.items, stats[currentKind] || {});
  } catch (e) { tip(e.message, 'error'); }
}
// 批4-3：某资产是否被出场引用（命中任意在案场 → 不可删）。__refStats 未载时后端仍会 409 兜底。
function isAssetReferenced(kind, id) {
  const st = (window.__refStats || {})[kind] || {};
  const hit = st[id];
  return hit ? (hit.count || 0) : 0;
}
function scopeDetail(it, st) {
  const sc = it.scopes || {};
  return `归属：项目${(sc.projects || []).length} / 集${(sc.episodes || []).length} / 场次${(sc.scenes || []).length}；出场场次：${(st.scenes || []).map(s => s.scene).join('、')}`;
}
function renderGroups(items, stats) {
  const el = document.getElementById('groups');
  const valid = items.filter(it => it.prefix);
  if (!valid.length) { el.innerHTML = '<div class="empty">暂无资产，点击"＋ 新建"创建。</div>'; return; }
  const groups = {};
  valid.forEach(it => { (groups[it.prefix] = groups[it.prefix] || []).push(it); });
  const prefixes = Object.keys(groups).sort();
  // 组与单卡同网格平铺：多卡前缀=组（按变体数跨列），单卡前缀=卡片直接占 1 格
  // 生产化·批1：统一 AssetCard 组件（三卡种共用）
  el.innerHTML = '';
  prefixes.forEach(prefix => {
    const list = groups[prefix];
    if (list.length === 1) {
      const slot = document.createElement('div');
      el.appendChild(slot);
      makeAssetCard(slot, list[0], stats[list[0].id] || { count: 0, scenes: [] });
      return;
    }
    /* v2.2 实施9: 组内变体 1 行 N 列（修复 N=3 时 2+1 错位——.group padding+border 占 22px 导致 .cards auto-fill 150 装不下 N 列） */
    const span = Math.min(Math.max(list.length, 2), 4);
    const grp = document.createElement('div');
    grp.className = 'group';
    grp.style.gridColumn = 'span ' + span;
    grp.innerHTML = `<div class="group-head"><h3>${esc(prefix)}</h3></div><div class="cards"></div>`;
    const cards = grp.querySelector('.cards');
    cards.style.gridTemplateColumns = `repeat(${list.length}, minmax(0, 1fr))`;
    list.forEach(it => {
      const slot = document.createElement('div');
      cards.appendChild(slot);
      makeAssetCard(slot, it, stats[it.id] || { count: 0, scenes: [] });
    });
    el.appendChild(grp);
  });
}
// 通用放大预览：点卡片左上 🔍 弹固定遮罩显示大图（1.2：资产库卡片左上拖拽改放大）
function zoomPreview(path) {
  if (!path) { tip('该资产暂无图片', 'error'); return; }
  const u = '/api/asset-file/' + encodeURIComponent(path);
  const m = document.createElement('div');
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:900;display:flex;align-items:center;justify-content:center;cursor:zoom-out';
  m.innerHTML = '<img src="' + esc(u) + '" style="max-width:92vw;max-height:88vh;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.5)" onerror="this.style.display=\'none\';toast(\'图片加载失败\',\'error\')">';
  m.onclick = function () { m.remove(); };
  document.body.appendChild(m);
}
// 普通资产（人物/场景/道具）AssetCard 实例：取 images[0] 当前有效图；四角 = 左上🔍放大 / 右上(有图→历史 / 无图→上传选库) / 右下⋯元数据；点卡→提示词编辑器
function makeAssetCard(slot, it, st) {
  const cur = (it.images || [])[0];
  const nImgs = (it.images || []).length;
  // v1.55d：🎙 音色角标（audios 数>0 显示，含样本/试听/绑定音频）
  const nAud = (it.audios || []).length;
  const voiceMark = nAud ? ` 🎙${nAud}` : '';
  // 批4-3：出场引用命中 → 不可删（红框禁删态）。引用数=0（含孤儿）→ 可删。
  const refN = st.count || 0;
  const locked = refN > 0;
  const sceneTxt = (st.scenes || []).length ? ' · 出场场次：' + st.scenes.map(s => s.scene).join('、') : '';
  // ④批4-3修复：锁定卡标记移至灰底白字条；主文字区(sub)显示引用/不可删，白字清晰可读
  const sub = (locked ? '被 ' + refN + ' 场引用 · 不可删' : '✔ 无引用 · 可删除')
    + `${it.prefix}${nImgs ? ' · ' + nImgs + ' 张图' : ''}${voiceMark}${sceneTxt}`;
  const kindKey = currentKind === 'characters' ? 'character' : currentKind === 'scenes' ? 'scene' : 'prop';
  /* v1.7 实施9: 按 kind 设 data-layout 驱动 3:4/16:9（CSS 覆盖 vendor 150px 固定） */
  const layout = (currentKind === 'scenes') ? 'landscape' : 'portrait';
  slot.setAttribute('data-layout', layout);
  const ac = new window.AssetCard(slot, {
    kind: kindKey,
    data: {
      id: it.id,
      path: cur ? cur.path : '',
      thumbnailUrl: cur ? '/api/asset-file/' + encodeURIComponent(cur.path) : '',
      name: it.variant_name,
      sub: sub,
      full: it
    },
    icons: {
      tl: { icon: '🔍', title: '放大预览大图', action: 'zoom' },   // 四角统一：左上=放大预览
      tr: { icon: '⬆', title: '上传 / 从资产库选择', action: 'upload' },  // 右上=上传/选图
      bl: { icon: '🔗', title: '查看引用/出场', action: 'view' },   // 左下=查看引用（B 批四角统一）
      br: { icon: '⋯', title: '资产信息', action: 'meta' }         // 右下=元数据编辑
    },
    onClick: function (card) { openPrompt(card.data.id, card.el.querySelector('.ac-thumb')); },
    onZoom: function (card) { zoomPreview(card.data.path); },
    onView: function (card) { viewAssetRefs(card.data.full, st); },
    onMeta: function (card) { openMeta(card.data.id); },
    onUpload: function (card) { openCardActionsForCard(card); },
    onDragStart: function () {},
    onDragEnd: function () {}
  });
  // 批4-3：被引用卡片 → 红框禁删态（红字 + 红框，明显视觉提示）
  if (ac.el) {
    if (locked) ac.el.classList.add('ac-locked');
    ac.el.setAttribute('data-ref', locked ? refN : '0');
    // 普通资产卡保留右键菜单入口
    ac.el.addEventListener('contextmenu', function (e) { showCtx(e, it.id); });
  }
}
// 无图→上传/从库选择：卡片定位锚点弹出 card-actions-menu
function openCardActionsForCard(card) {
  closeCardActions();
  const m = document.getElementById('card-actions-menu');
  const r = (card.el || document.body).getBoundingClientRect();
  m.style.display = 'block';
  m.style.left = Math.min(r.right - 150, window.innerWidth - 170) + 'px';
  m.style.top = Math.min(r.bottom + 6, window.innerHeight - 110) + 'px';
  m.dataset.id = card.data.id;
}

// B 批四角统一·左下 🔗 查看引用：主三库资产 —— 显示该资产出场(被哪些场引用) + 主图物理图引用来源(含生成引用)
function viewAssetRefs(asset, st) {
  const nm = (asset.prefix || '') + '-' + (asset.variant_name || '');
  const scenes = (st && st.scenes) || [];
  let html = '';
  if (scenes.length) {
    html += '<div style="font-size:12px;color:#6b7280;padding:6px 12px;background:#f9fafb">出场引用（' + scenes.length + ' 个场）</div>' +
      scenes.map(s => '<div style="padding:8px 12px;border-bottom:1px solid #f3f4f6;font-size:13px">🎬 ' + esc(s.scene || s.sid || '') + '</div>').join('');
  } else {
    html += '<div style="padding:12px;color:#9ca3af;font-size:13px">暂无出场引用（未在任何场被 @ / 出场）</div>';
  }
  // 主图物理图侧引用（含 ⚡ 生成引用）
  const cur = (asset.images || [])[0];
  if (cur && cur.path) {
    try {
      // 通过 /assets/index/unclassified 无法查；此处提示"引用来源见右下元数据/资产卡"足够（主三库被引用主要体现在出场，无需物理图明细）
    } catch (e) {}
  }
  window.confirmDialog('出场/被引用（' + nm + '）', `<div style="max-height:280px;overflow:auto">${html}</div>`, function () {}, '关闭');
}

// ===== 未分类区（第四标签，v1.4，A：点击归类） =====
async function renderUnassigned() {
  document.getElementById('lib-meta').textContent = '未分类区';
  const el = document.getElementById('groups');
  let data;
  try { data = await api('/assets/index/unclassified'); } catch (e) { el.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; return; }
  const items = (data.entries || []);
  if (!items.length) { el.innerHTML = '<div class="empty">暂无未分类资产（新导入/上传且未挂到任何资产的图会出现在这里）</div>'; return; }
  el.innerHTML = '';
  items.forEach(e => {
    const slot = document.createElement('div');
    el.appendChild(slot);
    makeUnassignedCard(slot, e);
  });
}
function locateSceneLabel(sid) {
  if (!sid || !scopeTree) return sid;
  for (const p of scopeTree) {
    for (const ep of (p.episodes || [])) {
      const sc = (ep.scenes || []).find(s => s.id === sid);
      if (sc) return (ep.title || '') + '-' + (sc.title || '');
    }
  }
  return sid;
}
// 第6批 item1/3 + 目检①：未分类卡引用信息。sub=归属/截帧标注（引用计数由 asset-card 底部"引用计数：N"行显眼显示）
function unassignedCardInfo(e) {
  const cnt = e.ref_count || 0;
  const ss = e.source_scene;
  if (ss && ss.sid) {
    return { sub: '🎬 场视频截帧 · ' + locateSceneLabel(ss.sid), locked: cnt > 0 };
  }
  if (cnt > 0) {
    return { sub: '被 ' + cnt + ' 处引用', locked: true };
  }
  return { sub: '', locked: false };
}
function makeUnassignedCard(slot, e) {
  const path = e.path || '';
  const info = unassignedCardInfo(e);
  slot.setAttribute('data-layout', 'portrait');  /* v2.1 实施9: 统一比例无白框 */
  const ac = new window.AssetCard(slot, {
    kind: 'unassigned',
    data: { id: e.id || '', path: path, thumbnailUrl: '/api/asset-file/' + encodeURIComponent(path), name: path.split('/').pop(), sub: info.sub, ref_count: e.ref_count || 0, ref_sources: e.ref_sources || [], source_scene: e.source_scene },
    icons: {
      tl: { icon: '🔍', title: '放大预览大图', action: 'zoom' },   // 四角统一：左上=放大
      // v1.3（用户 09-08 裁定）：素材标签卡片 ⬆ 上传暂不实现（等数据层改造批：素材=资产有 images[] 累积/切主图后统一给）。
      //   当前 tr=null 无上传图标——换主图/加图走卡 ⋯ 元数据面板内"📤 上传主图素材 ▾"（openMeta/editingImages/saveMeta 体系）。
      tr: null,
      bl: { icon: '🔗', title: '查看引用/归属（含归类到资产）', action: 'view' },  // 左下=看引用（B 批四角统一）
      br: { icon: '⋯', title: '资产信息 / 元数据编辑', action: 'meta' }   // 右下=元数据（去"落地参考类"内部术语）
    },
    onClick: function (card) { openUnassignedPrompt(card.data.path, card.el.querySelector('.ac-thumb')); },
    onZoom: function (card) { zoomPreview(card.data.path); },
    onView: function (card) { openUnassignedMeta(card.data); },   // 左下 🔗：引用来源 + 归类到资产按钮
    onMeta: function (card) { openRefMeta(null, card.data.path); }   // 右下 ⋯：落地为参考类素材(openMeta 编辑)
  });
  // 第6批 item3：被引用（ref_count>0）未分类卡（截帧图等）灰底白字标"不可删"，统一右键菜单-删除
  if (ac.el) {
    if (info.locked) ac.el.classList.add('ac-ref-locked');
    ac.el.addEventListener('contextmenu', function (ev) { showCtx(ev, path, 'unassigned'); });
  }
}
// 第6批 item1：删除未分类图（ref_count>0 后端 409 拦并返回 ref_sources；=0 删物理+索引标记）
async function delUnassigned(path) {
  window.confirmDialog('删除未分类图', '<div style="line-height:1.7">确认删除该未分类图片？<br><span style="color:#9ca3af;font-size:12px">被引用（截帧图/素材被引用）时后端会拦截并提示引用来源。</span></div>', async function () {
    try {
      await api('/assets/unclassified?path=' + encodeURIComponent(path), { method: 'DELETE' });
      tip('已删除未分类图', 'success');
      afterMutate();
    } catch (e) {
      const d = e.detail || {};
      if (d.ref_sources && d.ref_sources.length) {
        const srcs = d.ref_sources.map(s => {
          if (s.type === 'scene_video') return '🎬 场视频截帧 · ' + locateSceneLabel(s.sid);
          if (s.type === 'asset') return '资产 ' + (s.kind || '') + '/' + (s.id || '');
          if (s.type === 'generation') return '⚡ 生成引用 · ' + locateSceneLabel(s.sid || '') + (s.field === 'ref' ? '（作参考图生成）' : '');
          return s.type || '';
        });
        window.confirmDialog('该图被引用，不可删除', '<div style="line-height:1.8">被 ' + (d.count || srcs.length) + ' 处引用：<br>' + srcs.join('<br>') + '</div>', function () {}, '知道了');
      } else {
        tip(e.message || e.detail?.msg || '删除失败', 'error');
      }
    }
  }, '删除');
}
// ===== 参考类区（v1.53 参考类资产模型，kind=reference） =====
async function renderReferences() {
  document.getElementById('lib-meta').textContent = '参考类';
  const el = document.getElementById('groups');
  let data;
  try { data = await api('/references'); } catch (e) { el.innerHTML = '<div class="empty">加载失败：' + esc(e.message) + '</div>'; return; }
  const items = (data.items || []);
  if (!items.length) { el.innerHTML = '<div class="empty">暂无参考类资产。可在统一提示词编辑器"＋→⬆ 本地上传参考图"时登记为参考类资产。</div>'; return; }
  
  // 批量操作控件（P1：zero 判定合并 assets_index 引用，防把"落地自截帧图、被场引用"的卡当可删批量删）
  let batchControls = '';
  const zeroCount = items.filter(r => refTotalCount(r) === 0).length;
  if (zeroCount > 0) {
    batchControls = `
      <div style="margin-bottom:12px;padding:8px;background:#f3f4f6;border-radius:8px">
        <span style="font-size:12px;color:#6b7280">选中 ${zeroCount} 个计数为0的参考类资产</span>
        <button class="btn btn-danger btn-small" style="float:right" onclick="batchDeleteReferences()" id="batch-delete-btn">一键批量删除</button>
      </div>
    `;
  }
  
  el.innerHTML = batchControls;
  items.forEach(r => {
    const slot = document.createElement('div');
    el.appendChild(slot);
    makeReferenceCard(slot, r);
  });
}
// v1.2 阶段2（IC 工作流工坊化·素材标签合并）："素材"标签 = 参考类(/references) + 未分类(/assets/index/unclassified)
//   混排同列展示。纯 UI 合并——两接口各自照旧、删除逻辑各自保留（参考类 delReference / 未分类 delUnassigned），
//   仅卡片按"素材"统一呈现，不做来源大标签。删除后刷新走本函数保持视图一致。
async function renderMaterial() {
  document.getElementById('lib-meta').textContent = '素材区';
  const el = document.getElementById('groups');
  let refs, uncls;
  try { [refs, uncls] = await Promise.all([

   新版不锁屏、不操控模态、天然支持多任务并行：只登记 taskId，数据由导航栏统一轮询

  if (window.__qLast) _consumeTasks(window.__qLast);     // 立即消费一帧（提交后不等 4s 轮询）

  return p === 1 ? '排队中 · 第 1 位（下一个开始）' : '排队中 · 第 ' + p + ' 位（前面还有 ' + (p - 1) + ' 个任务）';

      delete _watched[tid];
      if (w.onCancelled) w.onCancelled();
      return;

    w.seen = true;
    const meta = t.meta || {};
    if (t.state === 'done') {
      delete _watched[tid];
      if (w.onDone) w.onDone(meta.result || {});
    } else if (t.state === 'fail') {

      + '</div>'

    wrap.addEventListener('mousemove', move);

  }

    const r = await api('/enhance/generate', jsonBody('POST', {
      source_kind: kind || currentKind, source_id: id, strength: strength,
    }));
    _enhTaskId = r.task_id;
    queueFeedback('已添加到队列中');
    _watchTask(r.task_id, 'enhance', '细节增强', {
      onDone: res => {
        _applyGenPlaceholders(window.__qLast);
        if (res.before && res.after) showCompare('/api/asset-file/' + res.before, '/api/asset-file/' + res.after);
        load();
        tip('细节增强完成，已入库为该资产主图', 'ok');
      },
      onFail: err => { _applyGenPlaceholders(window.__qLast); tip('增强失败：' + err, 'error'); },
      onCancelled: () => { _applyGenPlaceholders(window.__qLast); tip('已取消（不会入库）', 'info'); },
    });
  } catch (e) {
    tip('增强失败：' + ((e && e.message) || e), 'error');
  }
}

/* ①·步1 A1：资产卡「动作迁移」——人物主图 + 场景图 + 动作参考视频 → 生成带声音的新视频，
   落库 = 参考类资产卡（首帧主图 images[0] + 元数据含视频路径）。
   预校验：≤200MB、2–15 秒（时长经 <video> 元数据实测，后端 ComfyUI 节点硬校验兜底）。 */
let _motionCtx = null;      // { assetId, name, kind, charPath }
let _motionPoll = null;
let _motionChars = [];      // 有主图的人物候选（导航栏入口用）
function openMotionModal() { document.getElementById('motion-mask').style.display = 'flex'; }
function closeMotion() {

}
/* ⓪-4（用户 00:3x 口径）：动作迁移入口移至页顶导航栏（不依赖已打开的卡）——弹窗自带人物下拉。 */
async function openMotion(preferId) {
  openMotionModal();
  document.getElementById('motion-result').style.display = 'none';
  document.getElementById('motion-status').textContent = '';
  document.getElementById('motion-go').disabled = false;
  try {
    const r = await api('/characters');
    _motionChars = ((r && r.items) || []).filter(x => x.images && x.images[0] && x.images[0].path);
  } catch (e) { _motionChars = []; }
  const sel = document.getElementById('motion-char-sel');
  sel.innerHTML = '';
  if (!_motionChars.length) {
    sel.innerHTML = '<option value="">（人物库还没有带主图的人物——先去人物库生成一张）</option>';
    _motionCtx = null;
    document.getElementById('motion-char').removeAttribute('src');
    return;
  }
  _motionChars.forEach(x => {
    const o = document.createElement('option');
    o.value = x.id;
    o.textContent = (x.name || x.prefix || x.id) + (x.variant_name ? ' · ' + x.variant_name : '');
    sel.appendChild(o);
  });
  // 默认选中：优先当前打开的卡（若在人物库），否则第一个
  const cur = preferId && _motionChars.some(x => x.id === preferId) ? preferId : _motionChars[0].id;
  sel.value = cur;
  onMotionCharChange();
  await openMotionLegacySetup();   // 场景下拉 + 动作描述预填 + 文件区重置
}
function onMotionCharChange() {
  const sel = document.getElementById('motion-char-sel');
  const it = _motionChars.find(x => x.id === sel.value);
  if (!it) { _motionCtx = null; return; }

  document.getElementById('motion-title').textContent = '动作迁移 —— ' + _motionCtx.name;
}

document.addEventListener('change', async ev => {
  if (ev.target && ev.target.id === 'motion-file') {
    const f = ev.target.files[0];
    const info = document.getElementById('motion-fileinfo');
    if (!f) { info.textContent = '未选择视频'; return; }
    if (f.size > 200 * 1024 * 1024) {
      info.textContent = '✗ 超过 200MB（' + (f.size / 1048576).toFixed(1) + 'MB），请压缩后上传';
      ev.target.value = ''; return;
    }
    info.textContent = '读取视频信息…';
    const url = URL.createObjectURL(f);
    const v = document.createElement('video');
    v.preload = 'metadata';
    v.onloadedmetadata = () => {
      URL.revokeObjectURL(url);
      const d = v.duration;
      if (!(d >= 2 && d <= 15)) {
        info.textContent = '✗ 视频时长 ' + d.toFixed(1) + 's，需在 2–15 秒之间';
        ev.target.value = '';
      } else {
        info.textContent = '✓ ' + f.name + '（' + (f.size / 1048576).toFixed(1) + 'MB / ' + d.toFixed(1) + 's）';
      }
    };
    v.onerror = () => { info.textContent = '✗ 无法读取该视频文件'; ev.target.value = ''; };
    v.src = url;
  }
});
async function startMotion() {
  if (!_motionCtx) return;
  const scene = document.getElementById('motion-scene').value;
  if (!scene) { tip('请先选择场景参考图', 'error'); return; }
  const f = document.getElementById('motion-file').files[0];
  if (!f) { tip('请先选择动作参考视频', 'error'); return; }
  const prompt = document.getElementById('motion-prompt').value.trim();
  if (!prompt) { tip('请填写动作描述', 'error'); return; }
  const duration = parseFloat(document.getElementById('motion-duration').value);
  if (!(duration >= 2 && duration <= 15)) { tip('时长需在 2–15 秒', 'error'); return; }
  const st = document.getElementById('motion-status');
  const go = document.getElementById('motion-go');
  go.disabled = true;
  document.getElementById('motion-result').style.display = 'none';
  try {
    st.textContent = '上传动作参考视频…';
    const fd = new FormData();
    fd.append('asset_id', _motionCtx.assetId);
    fd.append('file', f);
    const up = await fetch('/api/motion/upload-video', { method: 'POST', body: fd });
    const uj = await up.json().catch(() => ({}));
    if (!up.ok) throw new Error(uj.detail || ('上传失败 ' + up.status));
    st.textContent = '提交生成任务…';
    const r = await api('/motion/generate', jsonBody('POST', {
      char_image: _motionCtx.charPath, scene_image: scene, motion_video: uj.path,
      prompt: prompt, duration: duration,
      source_kind: _motionCtx.kind, source_id: _motionCtx.assetId, source_name: _motionCtx.name,
    }));
    const tid = r.task_id;
    const cbtn = document.getElementById('motion-cancel-btn');
    const _endCancelBtn = () => { cbtn.style.display = 'none'; };
    cbtn.onclick = async () => {
      if (!confirm('确定取消本次生成？（已排队/生成中的任务会被打断，不产生结果）')) return;
      cbtn.disabled = true;
      try { await api('/motion/cancel/' + tid, { method: 'POST' }); } catch (e) {}
      cbtn.disabled = false;
    };
    cbtn.style.display = 'inline-block';
    st.textContent = '已提交，排队中…';
    /* ② F5a：motion 不弹入队模态（本弹窗自带内联状态行且不锁屏），但角标同样闪动、队列立刻刷新 */
    if (window.__flashQueue) window.__flashQueue();
    if (window.__refreshQueue) window.__refreshQueue();
    _motionPoll = setInterval(async () => {
      let t = null;
      try { t = await api('/motion/task/' + tid); } catch (e) { return; }
      st.textContent = (t.status === 'queued') ? _queueLine(tid) : (t.progress || t.status);
      if (t.status === 'succeeded') {
        clearInterval(_motionPoll); _motionPoll = null; _endCancelBtn();
        go.disabled = false;
        const v = document.getElementById('motion-result');
        v.src = '/api/asset-file/' + t.result.video_path;
        v.style.display = 'block';
        st.textContent = '✓ 已生成并入库：资产卡当前视频（第 ' + t.result.version + ' 版，可在资产卡视频版本中切换）';
        tip('动作迁移完成，已入库为资产卡视频', 'ok');
      } else if (t.status === 'cancelled') {
        clearInterval(_motionPoll); _motionPoll = null; _endCancelBtn();
        go.disabled = false;
        st.textContent = '已取消（不产生结果，不占用库存）';
        tip('已取消本次生成', 'info');
      } else if (t.status === 'failed') {
        clearInterval(_motionPoll); _motionPoll = null; _endCancelBtn();
        go.disabled = false;
        st.textContent = '✗ 失败：' + (t.error || '未知原因');
        tip('生成失败：' + (t.error || ''), 'error');
      }
    }, 3000);
  } catch (e) {
    go.disabled = false;
    st.textContent = '✗ ' + ((e && e.message) || e);
    tip('提交失败：' + ((e && e.message) || e), 'error');
  }
}
// 6-7：生图前 IC 预检 + 一键拉起（自动）——IC 不可达(ic.ok=false)时 toast 提示并 POST /api/ic/boot，
//   boot 就绪(ok=true)后由调用方继续原生成请求；boot 失败/未配置 ic_path → 抛错携带 boot.msg 指引（不静默）。
async function ensureIcReady() {
  var h = null;
  try { h = await api('/ic/health'); } catch (e) { h = { ic: { ok: false } }; }
  if (h && h.ic && h.ic.ok) return true;                 // IC 已就绪，无需拉起
  tip('IC 未运行，正在自动拉起…', 'info');                 // 自动拉起，免用户手动
  var b = null;
  try { b = await api('/ic/boot', { method: 'POST' }); }
  catch (e) { throw new Error('IC 拉起请求失败：' + ((e && e.message) || e)); }
  if (!b || !b.ok) throw new Error((b && b.msg) || 'IC 自动拉起失败');  // ic_path 无效等 → 报错指引到设置页配置
  return true;
}

// 资产生成（统一编辑器 onGenerate）：组装 prompt → /api/comfy/generate（阶段5 切流，直连 ComfyUI）→ 有资产则 unshift 为当前有效图，否则进未分类区
async function assetGenImage(id, prompt, params, refs, rawText) {
  if (!prompt.trim()) { tip('请先输入提示词', 'error'); return; }
  // 阶段5（B-20260908-03）：直连 ComfyUI（绕 IC），不再预检/拉起 IC。映射工作流文件→workflow_type
  const _wft = { 'Z-Image.json': 'z_image', '2511.json': '2511', 'Flux2-Klein.json': 'klein', 'Z-Image-Enhance.json': 'enhance', 'upscale.json': 'upscale' };
  const wfFile = (params && params.workflow) || 'Z-Image.json';
  // v2 升级（⓪-2 步3）：未接入后端的工作流**不许静默回退**成 z_image
  //   （否则会出现"选了图像编辑、实际出的是文生图"这种静默错行为）
  if (wfFile === 'Qwen-Edit.json') {   // ①·步2 A2：走独立路由模块（步A：新域不进 main.py）
    return editGenerate(id, prompt, refs, !!(params && params.cloud), (params && params.cloud_model) || '');   // ④ F5c：云端开关+模型随行
  }
  if (wfFile === 'Z-Image-Enhance.json') {   // ①·步3 A3：走独立路由模块（步A）
    const rgEl = document.getElementById('pe-strength');
    const strength = rgEl ? parseFloat(rgEl.value) : 0.5;
    return enhanceGenerate(id, strength);
  }
  if (!_wft[wfFile]) {
    tip('「' + String(wfFile).replace('.json', '') + '」还没接入，暂时无法生成', 'error');
    return;
  }
  // v2 升级（⓪-2 步4 · A3）落库语义已定（手册 §2.2：images[] unshift，原图保留）——本分支上移至
  //   Qwen-Edit 分支处走独立路由模块 routers_enhance.py（步A），此处旧拦截已删（①·步3 真接通）。
  const wfType = _wft[wfFile];
  /* ★ 用户 2026-10-01：清晰度选项去掉 ⇒ 分辨率固定 **1K**，宽高由**比例**决定：
     长边 1024，短边按比例取 64 的倍数（模型友好）。原先 size 只认 '1344x768' 一个特例、
     其余一律 1024×1024 —— 等于"选了 9:16 还是出方图"，这次一并修正。 */
  const size = (params && params.size) || '1K';
  let [width, height] = window.dimsByRatio((params && params.ratio) || '');
  if (size === '1344x768') { width = 1344; height = 768; }   // 兼容历史草稿里的旧值
  // ★ ②步2遗留：body 带 source_kind/source_id —— 队列任务可精确点亮该资产的「生成中示意图」+ 任务卡详情可辨
  const body = { workflow_type: wfType, prompt: prompt, width: width, height: height,
                 source_kind: currentKind, source_id: id || '',
                 use_cloud: !!(params && params.cloud),   // ★ ④ F5c：云端开关（后端判定 channel）
                 cloud_model: (params && params.cloud_model) || '' };   // ★ ④ F5c：本次云端模型
  if (refs && refs.length) body.ref_images = refs.map(r => r.path);   // 参考图（相对 SharedAssets 路径），后端经 /upload/image 上传
  // ★ ②步2遗留：/api/comfy/generate 由「同步直出 PNG（阻塞 1-2 分钟）」改为**异步任务**（契约 = {task_id}）。
  //   等结果的方式与 edit/enhance 完全一致：入队提示模态（2.5s 自动消失）+ 导航栏角标 + 生成中示意图，
  //   完成后由 _watchTask 回调 _bindGenResult 绑卡（原同步返回路径的内联绑定逻辑整体搬入，行为不变）。
  try {
    const r = await api('/comfy/generate', jsonBody('POST', body));
    queueFeedback('已添加到队列中');     // ② F5a：入队提示（模态 + 角标闪动）
    const ctx = { id: id, prompt: prompt, refs: refs || [] };
    _watchTask(r.task_id, 'image', '生图', {
      onDone: res => _bindGenResult(ctx, res),
      onFail: err => tip('生成失败：' + err, 'error'),
      onCancelled: () => tip('已取消（不会入库）', 'info'),
    });
  } catch (e) { tip('提交失败：' + ((e && e.message) || e), 'error'); }
}

/* ★ ②步2遗留：生图任务完成后的绑定（原同步返回路径的内联逻辑整体搬迁，落库语义不变）
   res = meta.result = {path:'output/xxx.png', url, fname, prompt_id, workflow_type} */
async function _bindGenResult(ctx, res) {
  const id = ctx.id, prompt = ctx.prompt, refs = ctx.refs;
  const fname = res.fname || String(res.path || '').split('/').pop();
  const path = res.path || ('output/' + fname);
  if (!fname) { tip('任务完成但未返回图片', 'error'); return; }
  // v1.53：生成用到参考类资产 → 引用计数+1、引用源记资产ID
  const refPaths = (refs || []).map(x => x.path).filter(p => p && String(p).indexOf('refs/') === 0);
  if (refPaths.length) { try { await api('/references/use', jsonBody('POST', { paths: refPaths, asset_id: id || '' })); } catch (e) {} }
  if (id) {
    const it = await getAsset(id);
    const imgs = [{ path: path, version: '', gen_prompt: prompt, source: 'generate', added_at: new Date().toISOString().slice(0, 19) }, ...(it.images || [])];
    // 第6批 §2.3（步骤⑤）：生成绑资产时，把草稿引用的"未分类参考图"（非 refs/ 参考类、非本次产物）也归类到该资产，
    //   使其受资产 images 引用保护（ref_count+1，不可误删），实现"草稿参考图随生成归类"。
    const existing = new Set((it.images || []).map(function (x) { return x.path; }));
    existing.add(path);
    (refs || []).forEach(function (ref) {
      var rp = (ref && ref.path) ? String(ref.path) : '';
      if (!rp) return;
      if (rp.indexOf('refs/') === 0) return;            // 参考类已走 /references/use 计数，无需归类到资产
      if (existing.has(rp)) return;                       // 已是该资产图 / 本次产物
      if (String(rp).split('/').pop() === fname) return;  // 防误当参考图（本次产物同名）
      // 仅归类"未分类/上传"参考图（uploads/ 等已被版本索引登记的图片）；output/drama 已属某资产时不重复归类
      if (rp.indexOf('uploads/') === 0 || rp.indexOf('output/') === 0) {
        imgs.push({ path: rp, version: '', gen_prompt: '', source: 'ref_auto', added_at: new Date().toISOString().slice(0, 19) });
        existing.add(rp);
      }
    });
    await api('/' + currentKind + '/' + id, jsonBody('PUT', { images: imgs }));
    tip('✅ 已生成并设为当前资产图版本', 'success');
  } else {
    // B 批 N5：未绑卡生成（产物进未分类区）→ 对 @ 引用的"未分类/截帧图"(uploads/，非 refs/ 参考类、非本次产物)
    //   补 generation {pid} 项目级保护（后端按各图 source_scene.pid 优先 / 当前项目兜底）。
    //   使这些截帧/未分类图被生成引用也有账本，删归属场后仍保护至项目删除（P4/N5 缺口）。
    const genRefPaths = (refs || []).map(x => x.path).filter(p => p && String(p).indexOf('uploads/') === 0 && String(p).split('/').pop() !== fname);
    if (genRefPaths.length) {
      try {
        await api('/assets/generation/refs', jsonBody('POST', { paths: genRefPaths, pid: curProjId || localStorage.getItem('ss_current_project') || '' }));
      } catch (e) { /* 记账失败不阻断生成 */ }
    }
    tip('✅ 已生成（见未分类区，可归类）', 'success');
  }
  try { localStorage.removeItem(_peDraftKey(id)); } catch (e) {}
  peClose();
  load();
}

// v1.48：添加动作 = "项目+所选集"一并添加存储（点"添加"→整体入 chips）
function addScopeGroup() {
  const p = scopeTree.find(x => x.id === curProjId);
  if (!p) { tip('请先选择项目', 'error'); return; }
  if (pendingEpSelection.all) {
    if (!editingScopes.projects.includes(p.id)) editingScopes.projects.push(p.id);
    // "所有集"=项目级归属 + 该项目所有集一并入 episodes（场页"本集"过滤按集命中，需集级归属；
    // 与 scopeFilter 语义对齐，避免"全集可见、本集不可见"；显示仍折叠为项目 chip，buildScopeGroups all 隐藏集）
    // v1.16（U10 防复现②）：明确该操作粒度为「项目 + 全部集」，【不含具体场】——如需只归单集/单场请改选下面单集勾选；
    (p.episodes || []).forEach(e => { if (!editingScopes.episodes.includes(e.id)) editingScopes.episodes.push(e.id); });

function findCtx(kind, id) {
  for (const p of scopeTree) {
    if (kind === 'projects' && p.id === id) return p.name;
    for (const ep of p.episodes) {
      if (kind === 'episodes' && ep.id === id) return `${p.name} / ${ep.title}`;
      for (const sc of ep.scenes) {
        if (kind === 'scenes' && sc.id === id) return `${p.name} / ${ep.title} / ${sc.title}`;
      }
    }
  }
  return '';
}
function scopeTagLabel(level, id) {
  if (level === 'projects') return '📁 ' + (findCtx('projects', id) || id) + '（项目）';
  if (level === 'episodes') return '📺 ' + (findCtx('episodes', id) || id) + '（集）';
  return '🎬 ' + (findCtx('scenes', id) || id) + '（场）';
}
function addScope(level, id) { if (!editingScopes[level].includes(id)) editingScopes[level].push(id); }
function removeScope(level, i) { editingScopes[level].splice(i, 1); renderScopes(); }
// chips 悬浮提示（v1.44 用户要求）：显示该归属对应的详细信息，避免误解；信息从 scopeTree 实时解析，找不到回退原始 id
function scopeChipTitle(level, id) {
  for (const p of scopeTree) {
    if (level === 'projects' && p.id === id) {
      const eps = p.episodes || [];
      const scCount = eps.reduce((n, e) => n + ((e.scenes || []).length), 0);
      return '项目：' + p.name + '\n集数：' + eps.length + ' · 场数：' + scCount;
    }
    for (const ep of (p.episodes || [])) {
      if (level === 'episodes' && ep.id === id) {
        return '项目：' + p.name + '\n集：' + ep.title + '\n场数：' + ((ep.scenes || []).length);
      }
      for (const sc of (ep.scenes || [])) {
        if (level === 'scenes' && sc.id === id) {
          return '项目：' + p.name + '\n集：' + ep.title + '\n场：' + sc.title;
        }
      }
    }
  }
  return id;
}
// v1.50：归属明细 chips 紧凑横排——每已归属项目组一行（📁项目名 + 📺集标签横向滚动）；组头×删整组、组内集×删单个
function buildScopeGroups() {
  const groups = [];
  const projIndex = {};
  editingScopes.projects.forEach(pid => {
    const p = scopeTree.find(x => x.id === pid);
    const g = { id: pid, name: p ? p.name : pid, all: true, eps: [] };
    groups.push(g); projIndex[pid] = g;
  });
  editingScopes.episodes.forEach(eid => {
    const ctx = findEpCtx(eid);
    if (!ctx) return;
    if (projIndex[ctx.pid]) { if (!projIndex[ctx.pid].all) projIndex[ctx.pid].eps.push({ id: eid, label: ctx.epTitle }); }
    else { const g = { id: ctx.pid, name: ctx.name, all: false, eps: [{ id: eid, label: ctx.epTitle }] }; groups.push(g); projIndex[ctx.pid] = g; }
  });
  return groups;
}
function findEpCtx(eid) {
  for (const p of scopeTree) {
    const ep = (p.episodes || []).find(e => e.id === eid);
    if (ep) return { pid: p.id, name: p.name, epTitle: ep.title };
  }
  return null;
}
function findScopeIndex(level, id) { return editingScopes[level].findIndex(x => x === id); }
function removeProjectGroup(pid) {
  editingScopes.projects = editingScopes.projects.filter(x => x !== pid);
  const p = scopeTree.find(x => x.id === pid);
  const eids = ((p && p.episodes) || []).map(e => e.id);
  editingScopes.episodes = editingScopes.episodes.filter(eid => !eids.includes(eid));
  renderScopes(); renderEpMulti();
}
function renderScopes() {
  const el = document.getElementById('f-scopes');
  const groups = buildScopeGroups();
  if (!groups.length) { el.innerHTML = '<span style="font-size:12px;color:#9ca3af">未设置归属</span>'; return; }
  el.innerHTML = groups.map(g => {
    const head = g.all ? `📁 ${esc(g.name)}（所有集）` : `📁 ${esc(g.name)}`;
    const eps = g.eps.map(e => `<span class="scope-tag" title="${esc(scopeChipTitle('episodes', e.id))}">📺 ${esc(e.label)}<button onclick="removeScope('episodes',${findScopeIndex('episodes', e.id)})">×</button></span>`).join('');
    return `<div class="scope-group"><span class="scope-group-head">${head}<button class="scope-group-del" onclick="removeProjectGroup('${g.id}')" title="删除该组归属">×</button></span><span class="scope-group-eps">${eps}</span></div>`;
  }).join('');
}

  // 体检跳转标记（auditLocate 导航前写入 sessionStorage，跨页仍可读）
  var fromAudit = sessionStorage.getItem('ss_audit_flash') === '1';
  if (fromAudit) sessionStorage.removeItem('ss_audit_flash');
  var DUR = fromAudit ? 4000 : 2500;
  var flashCls = fromAudit ? 'ac-flash-red' : 'ac-flash';
  var selFlashTimer = null;
  function flash() {
    var card = document.querySelector('.asset-card[data-id="' + selId + '"]');
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
    /* v1.55 P0-3c：静态高亮改闪烁（320ms 亮/灭交替）；批4-3 体检=4s红框/场页=2.5s蓝框；防重入：新 flash 重置旧 timer */
    if (selFlashTimer) clearInterval(selFlashTimer);
    var t0 = Date.now(), on = true;
    card.classList.add(flashCls);
    selFlashTimer = setInterval(function () {
      if (Date.now() - t0 >= DUR) { clearInterval(selFlashTimer); selFlashTimer = null; card.classList.remove(flashCls); return; }
      on = !on;
      if (on) card.classList.add(flashCls); else card.classList.remove(flashCls);
    }, 320);
  }
  function tryLater(times) {
    if (document.querySelector('.asset-card[data-id="' + selId + '"]')) flash();
    else if (times > 0) setTimeout(function () { tryLater(times - 1); }, 150);
  }
  if (document.readyState === 'complete') tryLater(15);
  else window.addEventListener('load', function () { tryLater(15); });
  /* 跨 tab 切换：监听 #groups 子元素变化，每次重渲后尝试高亮 */
  var groups = document.getElementById('groups');
  if (groups && window.MutationObserver) {
    new MutationObserver(function () { tryLater(8); }).observe(groups, { childList: true, subtree: true });
  }
})();
</script>

<style>
