<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="160" height="160">
  <style>
    @keyframes grow { from {opacity:0; transform:translateX(-6px)} to {opacity:1; transform:none} }
    .b1 { animation: grow .5s ease-out both }
    .b2 { animation: grow .5s ease-out .18s both }
    .b3 { animation: grow .5s ease-out .36s both }
    .dot { animation: grow .5s ease-out .6s both }
  </style>
  <line class="b1" x1="8.6" y1="55" x2="57.7" y2="55" stroke="#A5C3B1" stroke-width="9.1" stroke-linecap="round"/>
  <line class="b2" x1="8.6" y1="71.4" x2="44.1" y2="71.4" stroke="#A5C3B1" stroke-width="9.1" stroke-linecap="round"/>
  <line class="b3" x1="8.6" y1="87.8" x2="32.9" y2="87.8" stroke="#A5C3B1" stroke-width="9.1" stroke-linecap="round"/>
  <circle cx="72.3" cy="27.7" r="23.7" fill="#2E5C4C"/>
  <circle class="dot" cx="79.6" cy="20.4" r="5.5" fill="#F4F1EA"/>
</svg>
