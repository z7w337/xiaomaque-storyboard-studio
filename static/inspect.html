<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小麻雀剧本分镜工坊 - 目检清单</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f5f6f8; color: #1f2937; min-height: 100vh; padding: 24px 16px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .head h1 { font-size: 18px; font-weight: 600; }
  .head .back { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; }
  .head .back:hover { background: #e5e7eb; }
  .memo { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; font-size: 13px; color: #374151; }
  .memo b { color: #2563eb; }
  .item { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .item-head { display: flex; align-items: center; gap: 10px; }
  .item-idx { width: 26px; height: 26px; border-radius: 50%; background: #eef2ff; color: #2563eb; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .item-title { flex: 1; font-size: 14px; font-weight: 500; line-height: 1.4; }
  .btn-confirm { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 13px; cursor: pointer; flex: none; min-width: 74px; }
  .btn-confirm:hover { background: #1d4ed8; }
  .btn-confirm.done { background: #16a34a; }
  .item-opinion { margin-top: 10px; }
  .item-opinion textarea { width: 100%; min-height: 56px; border: 1px solid #d1d5db; border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; resize: vertical; }
  .item-opinion textarea:focus { outline: none; border-color: #2563eb; }
  .item .opinion-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .footer { margin-top: 18px; display: flex; justify-content: flex-end; gap: 10px; }
  .btn-primary { background: #2563eb; color: #fff; border: none; border-radius: 8px; padding: 10px 22px; font-size: 14px; cursor: pointer; }
  .btn-primary:hover { background: #1d4ed8; }
  .btn-primary:disabled { background: #cbd5e1; cursor: not-allowed; }
  .toast { position: fixed; top: 18px; right: 18px; background: #111827; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.2); opacity: 0; transform: translateY(-8px); transition: all .25s; pointer-events: none; z-index: 999; }
  .toast.show { opacity: 1; transform: translateY(0); }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-mask.show { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 20px; width: 90%; max-width: 560px; box-shadow: 0 10px 30px rgba(0,0,0,.2); }
  .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .modal pre { background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px; font-size: 12px; max-height: 260px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .modal .m-actions { margin-top: 12px; display: flex; justify-content: flex-end; gap: 10px; }
  .m-ghost { background: #f3f4f6; color: #374151; border: 1px solid #e5e7eb; border-radius: 8px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .empty { text-align: center; color: #9ca3af; font-size: 13px; padding: 30px 0; }
  a { color: #2563eb; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>目检清单</h1>
    <button class="back" onclick="history.length>1?history.back():location.href='/'">返回</button>
  </div>
  <div class="memo" id="memo"></div>
  <div id="list"></div>
  <div class="footer">
    <button class="btn-primary" id="submitBtn" onclick="submitAll()">统一提交</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-mask" id="mask">
  <div class="modal">
    <h3>✅ 已提交目检结果</h3>
    <p style="font-size:12px;color:#6b7280;margin-bottom:8px;">以下为汇总，可复制后回传给实施/规划留痕。</p>
    <pre id="summary"></pre>
    <div class="m-actions">
      <button class="m-ghost" onclick="copySummary()">复制汇总</button>
      <button class="btn-primary" onclick="closeModal()">关闭</button>
    </div>
  </div>
</div>

<script>
  var qs = new URLSearchParams(location.search);
  var title = qs.get('title') || '';
  var itemStr = qs.get('items') || '';
  // 目检项：以 ;; 分隔；每项为描述文本
  var items = itemStr ? itemStr.split(';;').map(function(s){return s.trim();}).filter(Boolean) : [];
  // 兜底：无 URL 参数时给默认示例项
  if (!items.length) {
    title = title || '默认目检批次';
    items = ['目检示例项 1','目检示例项 2','目检示例项 3'];
  }
  // localStorage 键
  var batchKey = 'inspect_' + Date.now();
  var states = items.map(function(){ return { confirmed:false, opinion:'' }; });
  var confirmedCount = 0;

  // 渲染 memo
  var memo = document.getElementById('memo');
  memo.innerHTML = '<b>目检主题：</b>' + esc(title) + '<br>请逐项点击【确认】标记该项已通过；每项下方文本框可填对该项的补充意见（留空亦可）；全部确认后点【统一提交】。';

  // 渲染列表
  var list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = '<div class="empty">无目检项</div>';
    document.getElementById('submitBtn').disabled = true;
  } else {
    var html = '';
    items.forEach(function(t, i){
      html += '<div class="item">' +
        '<div class="item-head">' +
          '<span class="item-idx">' + (i+1) + '</span>' +
          '<span class="item-title">' + esc(t) + '</span>' +
          '<button class="btn-confirm" id="conf' + i + '" onclick="toggle(' + i + ')">确认</button>' +
        '</div>' +
        '<div class="item-opinion">' +
          '<div class="opinion-label">该项补充意见（可留空）</div>' +
          '<textarea id="op' + i + '" oninput="states[' + i + '].opinion=this.value"></textarea>' +
        '</div>' +
      '</div>';
    });
    list.innerHTML = html;
    // 初始化干净状态（此时 DOM 已生成，强制清空，杜绝旧实例/缓存残影）
    resetAll();
  }

  function toggle(i){
    states[i].confirmed = !states[i].confirmed;
    var btn = document.getElementById('conf'+i);
    if (states[i].confirmed) { btn.classList.add('done'); btn.textContent = '✓ 已确认'; confirmedCount++; }
    else { btn.classList.remove('done'); btn.textContent = '确认'; confirmedCount--; }
    updateSubmitState();
  }

  // 每次页面加载即强制清空：清空全部意见框、重置确认态、重置批次状态（防止上一轮残影复用）
  function resetAll(){
    states = items.map(function(){ return { confirmed:false, opinion:'' }; });
    confirmedCount = 0;
    for (var i=0;i<items.length;i++){
      var ta = document.getElementById('op'+i);
      if (ta) ta.value = '';
      var btn = document.getElementById('conf'+i);
      if (btn) { btn.classList.remove('done'); btn.textContent = '确认'; }
    }
    if (document.getElementById('submitBtn')) document.getElementById('submitBtn').disabled = true;
  }

  function updateSubmitState(){
    // 至少一项确认才可提交
    document.getElementById('submitBtn').disabled = confirmedCount === 0;
  }

  function submitAll(){
    var lines = [];
    lines.push('【目检批次】' + title);
    lines.push('提交时间：' + new Date().toLocaleString('zh-CN'));
    lines.push('------------------------------');
    items.forEach(function(t,i){
      var c = states[i].confirmed ? '✓ 已确认' : '✗ 未确认';
      var o = (states[i].opinion||'').trim() ? states[i].opinion.trim() : '（未填）';
      lines.push((i+1) + '. ' + t + '  [' + c + ']');
      lines.push('    意见：' + o);
    });
    var summary = lines.join('\n');
    // localStorage 留档
    try {
      var rec = { title: title, time: new Date().toISOString(), items: items.map(function(t,i){ return { text:t, confirmed:states[i].confirmed, opinion:states[i].opinion }; }) };
      localStorage.setItem(batchKey, JSON.stringify(rec));
      localStorage.setItem('inspect_last', JSON.stringify(rec));
    } catch(e){}
    // 弹窗展示
    document.getElementById('summary').textContent = summary;
    document.getElementById('mask').classList.add('show');
    toast('✅ 目检结果已提交，可复制汇总');
  }

  function copySummary(){
    var el = document.getElementById('summary');
    var txt = el.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function(){ toast('已复制到剪贴板'); }, function(){ fallbackCopy(txt); });
    } else { fallbackCopy(txt); }
  }
  function fallbackCopy(txt){
    var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('已复制到剪贴板'); } catch(e){ toast('复制失败，请手动全选复制'); }
    document.body.removeChild(ta);
  }
  function closeModal(){ document.getElementById('mask').classList.remove('show'); }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var tEl = null;
  function toast(msg){
    var el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(tEl); tEl = setTimeout(function(){ el.classList.remove('show'); }, 2400);
  }
  document.getElementById('mask').addEventListener('click', function(ev){ if (ev.target === this) closeModal(); });
</script>
</body>
</html>
