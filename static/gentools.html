<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小麻雀脚本与分镜工坊 - 生图工具</title>
<style>
  /* ===== 页面骨架（与工坊各页一致：侧栏 nav.js + 主区）===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: var(--ss-bg); color: #333; display: flex; min-height: 100vh; }
  .main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  main { max-width: 1180px; margin: 18px auto; padding: 0 18px; width: 100%; }
  button { padding: 8px 16px; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primary { background: var(--ss-green-600); color: #fff; }
  .btn-primary:hover { background: var(--ss-green-700); }
  .btn-ghost { background: var(--ss-bg); color: var(--ss-text-2); border: 1px solid var(--ss-border); }
  .btn-ghost:hover { background: var(--ss-border); }
  .btn-mini { padding: 4px 10px; font-size: 12px; border-radius: 6px; }
  .panel { background: var(--ss-card); border: 1px solid var(--ss-border); border-radius: 12px; padding: 18px; }
  .page-title { font-size: 18px; font-weight: 700; color: var(--ss-text-1); margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
  .page-title .sub { font-size: 12px; font-weight: 400; color: var(--ss-text-4); }
  .banner { font-size: 12px; color: #9a3412; background: #fff7ed; border: 1px solid #fed7aa; border-radius: 8px; padding: 6px 12px; margin: 8px 0 14px; line-height: 1.7; }
  .hint { font-size: 12px; color: var(--ss-text-4); line-height: 1.7; }
  textarea, input[type=number], input[type=text], select { border: 1px solid var(--ss-border-strong); border-radius: 8px; padding: 6px 8px; font-size: 13px; font-family: inherit; }
  textarea:focus, input:focus, select:focus { outline: none; border-color: var(--ss-green-600); }

  /* 生图工具：5 模式分段条 */
  #gt-modes { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
  .gt-mode { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--ss-border); border-radius: 10px; padding: 8px 16px; background: var(--ss-bg); cursor: pointer; font-size: 12px; color: var(--ss-text-2); }
  .gt-mode b { font-size: 13px; }
  .gt-mode i { font-style: normal; font-size: 11px; color: var(--ss-text-4); }
  .gt-mode:hover { border-color: var(--ss-green-600); }
  .gt-mode.active { background: var(--ss-green-50); border-color: var(--ss-green-600); color: var(--ss-green-700); }
  .gt-mode.active i { color: #6d6a9c; }
  /* 参考图槽 */
  .gt-slot-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .gt-slot { display: inline-flex; flex-direction: column; align-items: center; gap: 6px; border: 1px solid var(--ss-border); border-radius: 10px; padding: 8px; min-width: 120px; background: var(--ss-bg); }
  .gt-slot .lbl { font-size: 11px; color: var(--ss-text-3); }
  .gt-slot .box { width: 104px; height: 104px; border: 2px dashed var(--ss-border-strong); border-radius: 8px; overflow: hidden; cursor: pointer; background: var(--ss-card); display: flex; align-items: center; justify-content: center; color: var(--ss-text-4); font-size: 24px; }
  .gt-slot .box img { width: 100%; height: 100%; object-fit: cover; }
  .gt-divider { margin: 12px 0; border-top: 1px solid var(--ss-bg); }
  .range-row { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; color: var(--ss-text-2); }
  .range-row .rl { flex: 0 0 90px; }
  .range-row input[type=range] { flex: 1; }
  .range-row .rv { flex: 0 0 56px; text-align: right; color: var(--ss-green-600); }
  /* ===== 参考图槽：下拉菜单（上传 / 从资产库）===== */
  .gt-slot { position: relative; }
  .gt-slot-menu { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); margin-top: 4px; background: var(--ss-card); border: 1px solid var(--ss-border); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.12); z-index: 60; min-width: 150px; padding: 4px; display: none; }
  .gt-slot-menu.open { display: block; }
  .gt-slot-menu .gsm-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 12px; color: var(--ss-text-1); border-radius: 7px; cursor: pointer; white-space: nowrap; }
  .gt-slot-menu .gsm-item:hover { background: var(--ss-green-50); color: var(--ss-green-700); }
  .gt-slot-menu .gsm-sep { height: 1px; background: var(--ss-bg); margin: 3px 2px; }
  .gt-slot-menu .gsm-item.gsm-del { color: #b91c1c; }
  .gt-slot-menu .gsm-item.gsm-del:hover { background: #fef2f2; color: #991b1b; }
  /* ===== 资产库选择弹窗：Hover 大图预览 ===== */
  .gt-pick-prev { position: absolute; display: none; width: 172px; background: var(--ss-card); border: 1px solid var(--ss-border); border-radius: 10px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,.18); z-index: 80; pointer-events: none; }
  .gt-pick-prev img { width: 100%; display: block; }
  .gt-pick-row { display: flex; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 6px; cursor: pointer; }
  .gt-pick-row:hover { background: var(--ss-green-50); }
  .gt-pick-row img { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; background: #eceff3; flex-shrink: 0; }
  .gt-pick-row span { font-size: 12px; color: var(--ss-text-1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* ===== 2511 参考图联动预览 ===== */
  .gt-2511stage { position: relative; width: 100%; height: 210px; border-radius: 10px; overflow: hidden; background: radial-gradient(circle at 50% 38%, var(--ss-bg) 0%, #dbe3ec 70%, #ccd6e2 100%); margin-bottom: 8px; display: flex; align-items: center; justify-content: center; }
  .gt-2511stage .gt-2511ph { color: #94a3b8; font-size: 13px; text-align: center; line-height: 1.9; }
  .gt-2511stage .gt-2511img { max-width: 92%; max-height: 84%; border-radius: 8px; box-shadow: 0 12px 32px rgba(0,0,0,.28); transition: transform .06s linear; transform-style: preserve-3d; }
  .gt-2511stage .gt-2511-cmd { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.5); color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 6px; max-width: calc(100% - 16px); }
  /* ===== 生成结果：原图/生成图 Hover 分区对比（大预览，参照 before/after 分割）===== */
  .gt-cmp { position: relative; width: 100%; height: 420px; border-radius: 12px; overflow: hidden; background: var(--ss-ink-bar); border: 1px solid var(--ss-border); user-select: none; }
  .gt-cmp .gt-cmp-base, .gt-cmp .gt-cmp-top { position: absolute; inset: 0; }
  .gt-cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: repeating-conic-gradient(#262b33 0 25%, #1f232b 0 50%) 0 0/22px 22px; }
  .gt-cmp .gt-cmp-top { clip-path: inset(0 calc(100% - 50%) 0 0); }
  .gt-cmp .gt-cmp-line { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; background: var(--ss-card); box-shadow: 0 0 8px rgba(0,0,0,.6); cursor: ew-resize; }
  .gt-cmp .gt-cmp-line::after { content: '◂ ▸'; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); background: var(--ss-card); color: var(--ss-text-1); font-size: 12px; padding: 2px 6px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0,0,0,.4); white-space: nowrap; }
  .gt-cmp .gt-cmp-tag { position: absolute; top: 10px; font-size: 12px; padding: 3px 9px; border-radius: 6px; pointer-events: none; }
  .gt-cmp .gt-cmp-tag.t-orig { left: 10px; background: rgba(58,107,87,.9); color: #fff; }
  .gt-cmp .gt-cmp-tag.t-gen { right: 10px; background: rgba(22,163,74,.9); color: #fff; }
  .gt-cmp .gt-cmp-hint { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(0,0,0,.55); color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 6px; white-space: nowrap; }
  /* ===== 生图进行中模态（参照资产卡音色生成进度模态，v1.55b）===== */
  .gt-pg-mask { position: fixed; inset: 0; background: rgba(17,24,39,.45); z-index: 950; display: none; align-items: center; justify-content: center; }
  .gt-pg-card { background: var(--ss-card); border-radius: 16px; padding: 30px 42px; width: 340px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .gt-pg-icon { font-size: 40px; display: inline-block; animation: gt-pg-spin 1.2s linear infinite; }
  @keyframes gt-pg-spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .gt-pg-title { font-size: 16px; font-weight: 700; margin: 12px 0 4px; color: var(--ss-text-1); }
  .gt-pg-stage { font-size: 13px; color: var(--ss-text-3); margin-bottom: 14px; min-height: 18px; }
  .gt-pg-bar { height: 8px; border-radius: 4px; background: var(--ss-border); overflow: hidden; }
  .gt-pg-fill { height: 100%; width: 0%; background: var(--ss-green-600); transition: width .4s; border-radius: 4px; }
  .gt-pg-time { font-size: 12px; color: var(--ss-text-4); margin-top: 8px; }
</style>
</head>
<body>
<aside id="sidebar"></aside>
<div class="main-wrap">
  <!-- 生图进行中模态（参照资产卡音色生成进度模态 v1.55b） -->
  <div class="gt-pg-mask" id="gt-pg-mask">
    <div class="gt-pg-card">
      <!-- ⓪-VI·步3（D6 首发）：生成等待 = 品牌帧线动效，替换 🎨 旋转 emoji -->
      <div class="gt-pg-icon"><img src="/static/brand/logo-motion-loop.svg" alt="生成中" style="width:72px;height:72px;display:inline-block"></div>
      <div class="gt-pg-title" id="gt-pg-title">生成图片中…</div>
      <div class="gt-pg-stage" id="gt-pg-stage">提交生成任务…</div>
      <div class="gt-pg-bar"><div class="gt-pg-fill" id="gt-pg-fill"></div></div>
      <div class="gt-pg-time" id="gt-pg-time">已耗时 0 秒</div>
    </div>
  </div>
<main>
  <div class="page-title">🎨 生图工具</div>

  <div class="panel">
    <div id="gt-modes"></div>
    <div id="gt-panel" style="min-height:120px"></div>
  </div>

  <div style="margin-top:10px" class="hint">独立于"资产库·点卡生图"入口（两入口并存）。图槽可从资产库（场景/道具/素材）选或本地上传（登记为参考类素材）。</div>
</main>
</div>

<script src="/static/palette.js?v=1"></script>
<script src="/static/vendor/aspect.js?v=1"></script>
<script>
/* ===== 生图工具独立页（阶段3 UI 先行：5 模式条件假参数；真实出图阶段4 /api/comfy/generate 接入）=====
   原为资产页顶部折叠面板，迁移为独立导航页(替换 nav"画布"项, 右部整页)。 */
var GEN_TOOLS_MODE = 'zimage';
var GEN_TOOLS_IMG = {};   // slot key -> {path, name} 各模式图槽已选图
/* ★ 用户 2026-10-01：Qwen-Image-2.1 专用界面状态
   - GT21_SLOTS：当前显示几个图槽（默认 2，可增删，上限 10 —— 用户定的界面上限；
     后端不写死，节点本身支持到 16，将来要加不用改代码）
   - GT21_RES  ：清晰度 = TextEncodeQwenImage21.resolution（1024=1K / 2048=2K） */
var GT21_SLOTS = 2;
var GT21_RES = 1024;
function gt21RefCount() { var n = 0; for (var i = 1; i <= GT21_SLOTS; i++) if (GEN_TOOLS_IMG['q21_' + i]) n++; return n; }

function toast(t, ty) { window.toast ? window.toast(t, ty) : alert(t); }
function escH(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

/* 工坊 API 封装（独立页自带，仿 assets 的 api()）：GET 返回 json；POST JSON/FormData */
function gtApi(path, opt) {
  opt = opt || {};
  var o = Object.assign({ headers: {} }, opt);
  if (o.body && typeof o.body !== 'string' && !(o.body instanceof FormData)) { o.headers['Content-Type'] = 'application/json; charset=utf-8'; o.body = JSON.stringify(o.body); }
  return fetch(path, o).then(function (r) {
    if (!r.ok) return r.json().then(function (x) { throw new Error((x && (x.detail || x.msg)) || ('请求失败 ' + r.status)); });
    return r.json();
  });
}

/* 6 模式定义：key / 名称 / 副题 / 面板渲染器 */
var GEN_MODES = [
  { key: 'zimage', name: 'Z-Image', sub: '文生图' },
  { key: 'qwen21', name: 'Qwen-Image-2.1', sub: '多图编辑 / 文生图' },
  { key: '2511', name: '2511', sub: '参考图·多角度' },
  { key: 'klein', name: 'Flux2-Klein', sub: '参考迁移' },
  { key: 'enhance', name: 'Enhance', sub: '细节增强' },
  { key: 'upscale', name: 'upscale', sub: '2K 超分' }
];
function renderGenModes() {
  var el = document.getElementById('gt-modes'); el.innerHTML = '';
  GEN_MODES.forEach(function (m) {
    var b = document.createElement('button');
    b.className = 'gt-mode' + (GEN_TOOLS_MODE === m.key ? ' active' : '');
    b.setAttribute('data-k', m.key);
    b.innerHTML = '<b>' + escH(m.name) + '</b><i>' + escH(m.sub) + '</i>';
    b.onclick = function () { switchGenMode(m.key); };
    el.appendChild(b);
  });
}
function switchGenMode(key) { GEN_TOOLS_MODE = key; renderGenModes(); renderGenPanel(); }

/* 参考图槽 UI：通用渲染单槽（点槽弹出 上传/从资产库 下拉菜单） */
function genSlotHTML(slotKey, label, required) {
  var cur = GEN_TOOLS_IMG[slotKey];
  var mn = '<div class="gt-slot-menu" id="gt-slotmenu-' + slotKey + '" data-k="' + slotKey + '">'
    + '<div class="gsm-item" onclick="genCloseSlotMenuAll();genPickImg(\'' + slotKey + '\')">📁 从资产库中选择</div>'
    + '<div class="gsm-item" onclick="genCloseSlotMenuAll();genUploadImg(\'' + slotKey + '\')">⬆ 本地上传</div>'
    + (cur ? '<div class="gsm-sep"></div><div class="gsm-item gsm-del" onclick="genClearImg(\'' + slotKey + '\');genCloseSlotMenuAll()">🗑 清除当前</div>' : '')
    + '</div>';
  return '<div class="gt-slot" id="gt-slot-' + slotKey + '"><div class="lbl">' + escH(label) + (required ? ' <span style="color:#dc2626">*</span>' : '') + '</div>'
    + '<div class="box" onclick="genToggleSlotMenu(event,\'' + slotKey + '\')">' + (cur ? '<img src="/api/asset-file/' + encodeURIComponent(cur.path) + '">' : '＋') + '</div>'
    + '<div style="font-size:10px;color:#9ca3af">' + (cur ? '点图：更换 / 上传' : '点选或上传参考图') + '</div>'
    + mn
    + '</div>';
}
/* 下拉菜单开关：点槽切换本菜单，并关闭其它菜单；点外部关闭 */
function genToggleSlotMenu(ev, slotKey) {
  if (ev) { ev.stopPropagation(); }
  var menu = document.getElementById('gt-slotmenu-' + slotKey);
  if (!menu) return;
  var isOpen = menu.classList.contains('open');
  genCloseSlotMenuAll();
  if (!isOpen) menu.classList.add('open');
}
function genCloseSlotMenuAll() {
  var list = document.querySelectorAll('.gt-slot-menu.open');
  for (var i = 0; i < list.length; i++) list[i].classList.remove('open');
}
document.addEventListener('click', function (e) {
  if (!e.target.closest || !e.target.closest('.gt-slot')) genCloseSlotMenuAll();
});
/* 从资产库选择弹窗：分组列表 + Hover 大图预览 */
function genPickPrev(slotKey, pathEnc, nameEnc) {
  var p = decodeURIComponent(pathEnc || '');
  var box = document.getElementById('gt-pick-prev');
  var imEl = document.getElementById('gt-pick-prev-img');
  var phEl = document.getElementById('gt-pick-prev-ph');
  var nmEl = document.getElementById('gt-pick-prev-name');
  if (!box || !imEl) return;
  if (p) {
    box.style.display = 'flex';
    if (phEl) phEl.style.display = 'none';
    imEl.style.display = 'block';
    imEl.src = '/api/asset-file/' + encodeURIComponent(p);
  } else {
    box.style.display = 'flex';
    if (phEl) phEl.style.display = 'block';
    imEl.style.display = 'none';
  }
  if (nmEl) nmEl.textContent = decodeURIComponent(nameEnc || '');
}
async function genPickImg(slotKey) {
  var listHtml = '', total = 0;
  var groups = [['scenes', '🏙️ 场景'], ['props', '🎭 道具'], ['references', '🧩 素材']];
  for (var gi = 0; gi < groups.length; gi++) {
    var gk = groups[gi][0], glbl = groups[gi][1], items = [];
    try { items = (await gtApi('/api/' + gk)).items || []; } catch (e) {}
    if (!items.length) continue;
    total += items.length;
    listHtml += '<div style="font-size:12px;color:#6b7280;padding:5px 2px;position:sticky;top:0;background:#fafafa">' + glbl + '（' + items.length + '）</div>';
    items.forEach(function (a) {
      var im = (a.images && a.images[0] && a.images[0].path) ? a.images[0].path : '';
      var nm = (gk === 'references') ? (a.path || im || '').split('/').pop() : ((a.prefix || '') + '-' + (a.variant_name || ''));
      if (im) listHtml += '<div class="gt-pick-row" onclick="genSetImg(\'' + slotKey + '\',\'' + encodeURIComponent(im) + '\',\'' + encodeURIComponent(nm) + '\')" onmouseenter="genPickPrev(\'' + slotKey + '\',\'' + encodeURIComponent(im) + '\',\'' + encodeURIComponent(nm) + '\')" title="点击选用">'
        + '<img src="/api/asset-file/' + encodeURIComponent(im) + '"><span>' + escH(nm) + '</span></div>';
    });
  }
  if (!total) listHtml = '<div style="padding:20px;color:#9ca3af;text-align:center">素材库暂无可用图片（可切换到「本地上传」）</div>';
  else listHtml += '<div style="margin-top:6px;font-size:11px;color:#9ca3af">悬停缩略图可预览大图，点击选用。</div>';
  // 弹窗整体固定 4:3 比例：左=分组列表(滚动)，右=hover 大图(撑满，不强制比例)
  var html = '<style>#g-modal-mask .g-modal{width:640px;height:480px;max-width:96vw;max-height:92vh;box-sizing:border-box;display:flex;flex-direction:column;padding:16px 18px}#g-modal-mask .g-modal h3{flex:0 0 auto}#g-modal-mask .g-modal .g-msg{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;white-space:normal}#g-modal-mask .g-modal .g-actions{flex:0 0 auto}</style>'
    + '<div style="flex:1 1 auto;min-height:0;display:flex;gap:14px;align-items:stretch">'
    + '<div style="flex:1.1;min-width:0;overflow:auto;padding-right:4px">' + listHtml + '</div>'
    + '<div style="flex:1;min-width:0;display:flex;flex-direction:column">'
    + '<div id="gt-pick-prev" style="display:flex;flex:1 1 auto;min-height:0;border-radius:10px;overflow:hidden;background:#eceff3;border:1px solid #e5e7eb;align-items:center;justify-content:center;position:relative">'
    + '<div id="gt-pick-prev-ph" style="color:#9ca3af;font-size:12px;text-align:center;line-height:1.8;padding:0 8px">👆 鼠标移到左侧素材<br>此处预览大图</div>'
    + '<img id="gt-pick-prev-img" src="" style="display:none;width:100%;height:100%;object-fit:contain"></div>'
    + '<div id="gt-pick-prev-name" style="margin-top:6px;font-size:12px;color:#6b7280;word-break:break-all;min-height:16px;flex:0 0 auto"></div>'
    + '</div></div>'
    + '<div style="margin-top:8px;flex:0 0 auto;font-size:12px;color:#9ca3af">也可 <a href="javascript:genUploadImg(\'' + slotKey + '\')" style="color:#3A6B57">⬆ 本地上传</a>（登记为参考类素材）</div>';
  if (!window.confirmDialog) return;
  window.confirmDialog('选择参考图（悬停预览）', html, function () {}, '关闭');
}
function genSetImg(slotKey, pathEnc, nameEnc) {
  var p = decodeURIComponent(pathEnc); if (!p) return;
  GEN_TOOLS_IMG[slotKey] = { path: p, name: decodeURIComponent(nameEnc) || p.split('/').pop() };
  renderGenPanel(); if (window.confirmDialog) { var m = document.getElementById('g-modal-mask'); if (m) m.style.display = 'none'; }
}
function genClearImg(slotKey) { delete GEN_TOOLS_IMG[slotKey]; renderGenPanel(); }
function genUploadImg(slotKey) {
  if (window.confirmDialog) { var m = document.getElementById('g-modal-mask'); if (m) m.style.display = 'none'; }
  var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
  input.onchange = function () {
    var f = input.files[0]; if (!f) return;
    var fd = new FormData(); fd.append('file', f);
    gtApi('/api/ref-upload', { method: 'POST', body: fd }).then(function (rec) {
      if (rec && rec.path) { GEN_TOOLS_IMG[slotKey] = { path: rec.path, name: f.name }; renderGenPanel(); toast('已上传并选用', 'success'); }
      else toast('上传未返回图', 'error');
    }).catch(function (e) { toast('上传失败：' + (e.message || e), 'error'); });
  };
  input.click();
}

  if (rv && Math.abs(rv) >= 1) { parts.push((rv > 0 ? '俯视' : '仰视') + Math.abs(rv) + '°'); }

function gtShowProgress(title, wfType) {
  GT_PG.t0 = Date.now();
  GT_PG.stages = GT_STAGES[wfType] || GT_STAGES.z_image;
  var el = document.getElementById('gt-pg-title'); if (el) el.textContent = title || '生成图片中…';
  document.getElementById('gt-pg-fill').style.width = '2%';
  document.getElementById('gt-pg-time').textContent = '已耗时 0 秒';
  document.getElementById('gt-pg-mask').style.display = 'flex';
  if (GT_PG.timer) clearInterval(GT_PG.timer);
  GT_PG.timer = setInterval(function () {
    var el2 = Date.now() - GT_PG.t0;
    var cur = GT_PG.stages[GT_PG.stages.length - 1];
    for (var i = 0; i < GT_PG.stages.length; i++) if (el2 >= GT_PG.stages[i].at) cur = GT_PG.stages[i];
    document.getElementById('gt-pg-stage').textContent = cur.text;
    document.getElementById('gt-pg-fill').style.width = cur.pct + '%';
    document.getElementById('gt-pg-time').textContent = '已耗时 ' + Math.floor(el2 / 1000) + ' 秒';
  }, 200);
}
function gtHideProgress(final) {
  if (GT_PG.timer) { clearInterval(GT_PG.timer); GT_PG.timer = null; }
  if (final) {
    document.getElementById('gt-pg-stage').textContent = '完成 ✓';
    document.getElementById('gt-pg-fill').style.width = '100%';
    setTimeout(function () { document.getElementById('gt-pg-mask').style.display = 'none'; }, 600);
  } else {
    document.getElementById('gt-pg-mask').style.display = 'none';
  }
}
/* 生图工具：收集当前模式参数 → 真调 /api/comfy/generate（阶段5-2 直连绕 IC） */
function genToolsRun() {
  var k = GEN_TOOLS_MODE; var p = { mode: k, params: {}, refs: [] };
  function val(id) { var e = document.getElementById(id); return e ? e.value : ''; }
  function need(key) { var it = GEN_TOOLS_IMG[key]; if (!it) { toast('请先选择参考图', 'error'); return false; } p.refs.push(it.path); return true; }
  if (k === 'zimage') {
    p.params.prompt = val('gt-zimg-prompt');
    var _dims = window.dimsByRatio(GT_RATIO);        // ★ 比例 → 宽高（1K 基准，与编辑器同源）
    p.params.width = _dims[0]; p.params.height = _dims[1];
    if (!p.params.prompt.trim()) { toast('请先输入提示词', 'error'); return; }
  }
  else if (k === 'qwen21') {
    /* ★ 有参考图 ⇒ 多图编辑（qwen21_edit）；无 ⇒ 文生图（qwen21）。
       参考图按图槽顺序收集（跳过空槽，顺序不变 —— 顺序即语义）。 */
    p.params.prompt = val('gt-q21-prompt');
    if (!p.params.prompt.trim()) { toast('请先输入提示词', 'error'); return; }
    for (var qi = 1; qi <= GT21_SLOTS; qi++) { var qit = GEN_TOOLS_IMG['q21_' + qi]; if (qit) p.refs.push(qit.path); }
    p.params.editing = p.refs.length > 0;
    p.params.resolution = GT21_RES;
  }
  else if (k === '2511') { if (!need('a1')) return; p.params.angle_h = parseFloat(val('gt-2511-rh')) || 0; p.params.angle_v = parseFloat(val('gt-2511-rv')) || 0; p.params.distance = parseFloat(val('gt-2511-dist')) || 4; p.params.prompt = val('gt-2511-prompt'); }
  else if (k === 'klein') { if (!need('k1')) return; if (GEN_TOOLS_IMG.k2) p.refs.push(GEN_TOOLS_IMG.k2.path); if (GEN_TOOLS_IMG.k3) p.refs.push(GEN_TOOLS_IMG.k3.path); p.params.prompt = val('gt-klein-prompt'); }
  else if (k === 'enhance') { if (!need('e1')) return; p.params.prompt = val('gt-enh-prompt'); p.params.strength = parseFloat(val('gt-enh-str')) || 0.5; }
  else if (k === 'upscale') { if (!need('u1')) return; p.params.target_res = val('gt-up-res') || '2048'; }

  // 阶段5-2：mode → workflow_type + body 构造（真调 /api/comfy/generate，绕 IC 直连）
  var TYPE = { zimage: 'z_image', qwen21: 'qwen21', '2511': '2511', klein: 'klein', enhance: 'enhance', upscale: 'upscale' };
  var body = { workflow_type: TYPE[k] || 'z_image', prompt: p.params.prompt || '', ref_images: p.refs || [], params: {},
               use_cloud: !!(document.getElementById('gt-platform-sel') && document.getElementById('gt-platform-sel').value === 'modelscope') };  // ★ 平台下拉：云端（不可分流模式后端自动忽略）
  if (k === 'zimage') { body.width = p.params.width; body.height = p.params.height; body.prompt = p.params.prompt; }
  else if (k === 'qwen21') {
    /* ★ Qwen-Image-2.1：有图 → 编辑工作流；无图 → 文生图工作流。
       · 编辑：清晰度走 `resolution`（1024/2048，TextEncodeQwenImage21 专用参数），画幅由参考图决定
       · 文生图：清晰度走 width/height（长边 1024/2048，按比例算 —— 复用 vendor/aspect.js）
       · 云端：文生图与编辑**都可用**（2026-10-01 实测），模型恒指定 Qwen/Qwen-Image-2.1 */
    body.prompt = p.params.prompt;
    if (p.params.editing) {
      body.workflow_type = 'qwen21_edit';
      body.resolution = p.params.resolution;
      /* ★ 编辑恒传**方形** width/height（= 清晰度）：
         本地 —— 与 resolution 同值（后端 res_also_size 也设同样值，不冲突）；
         云端 —— **必须传**，否则服务端自选比例（实测不传时出的是 760×1280 竖版，不是我们想要的方形）。 */
      body.width = p.params.resolution; body.height = p.params.resolution;
    } else {
      var _d21 = window.dimsByRatio(GT_RATIO, p.params.resolution);
      body.width = _d21[0]; body.height = _d21[1];
    }
    if (body.use_cloud) body.cloud_model = 'Qwen/Qwen-Image-2.1';
  }
  else if (k === '2511') { body.params = { angle_h: p.params.angle_h, angle_v: p.params.angle_v, distance: p.params.distance }; body.prompt = p.params.prompt || ''; }
  else if (k === 'enhance') { body.params = { strength: p.params.strength }; }
  else if (k === 'upscale') { body.params = { target_res: parseInt(p.params.target_res) || 2048 }; }
  // klein: 便捷层 prompt + ref_images 已够（Flux2-Klein 无 LoRA 节点，detail_lora 能力不落 json）

  var hint = document.getElementById('gt-gen-hint');
  var resEl = document.getElementById('gt-result');
  if (hint) hint.textContent = '生成中…';
  if (resEl) resEl.innerHTML = '';
  var t0 = Date.now();
  var wfType = TYPE[k] || 'z_image';
  gtShowProgress('生成图片中…（' + (GEN_MODES.find(function (m) { return m.key === k; }) || {}).name + '）', wfType);
  return gtApi('/api/comfy/generate', { method: 'POST', body: body }).then(function (r) {
    var imgs = r.images || [];
    if (!imgs.length) throw new Error('服务未返回图片');
    var url = '/api/asset-file/' + imgs[0];
    var secs = Math.round((Date.now() - t0) / 1000);
    gtHideProgress(true);
    if (hint) hint.textContent = '本次生成耗时约 ' + secs + 's（workflow=' + wfType + '）';
    // flux2(klein)/enhance/upscale/qwen21 编辑 走「原图 vs 生成图」Hover 分区对比大预览；其余单图大预览
    var isCompare = (k === 'klein' || k === 'enhance' || k === 'upscale' || (k === 'qwen21' && p.params.editing)) && p.refs.length && p.refs[0];
    var mediaHtml = isCompare
      ? genCmpBuild('/api/asset-file/' + encodeURIComponent(p.refs[0]), url)
      : '<img src="' + url + '" style="max-width:100%;max-height:520px;border-radius:10px;display:block;margin:0 auto;object-fit:contain;background:#f3f4f6">';
    if (resEl) resEl.innerHTML = '<div class="panel" style="padding:14px">' + mediaHtml
      + '<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:12px">'
      + '<div style="font-weight:600;color:#1f2937">✅ 生成完成（' + secs + 's · ' + wfType + '）</div>'
      + '<div class="hint">产物：<code>' + escH(imgs[0]) + '</code></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-left:auto">'
      + '<button class="btn-ghost btn-mini" onclick="window.open(\'' + url + '\',\'_blank\')">打开大图</button>'
      + '<button class="btn-ghost btn-mini" onclick="gtCopyAsset(\'' + escH(imgs[0]) + '\',\'' + wfType + '\')">保存到素材库</button>'
      + '</div></div></div>';
    // 云端跑通 ⇒ 清掉"上次云端失败"软提示
    if (body.use_cloud) { try { window.localStorage && window.localStorage.removeItem('gt_cloud_lastfail'); } catch (e2) {} gtRenderPlatformNote(); }
  }).catch(function (e) {
    gtHideProgress(false);
    var _msg = (e && e.message) || String(e);
    if (hint) hint.textContent = '生成失败';
    if (resEl) resEl.innerHTML = '<div style="color:#b91c1c;font-size:13px;padding:10px">生成失败：' + escH(_msg) + '</div>';
    /* ★ 云端没有健康端点，"上次失败"是唯一能拿到的软信号 ⇒ 记一条（不阻断，仅在下拉旁提示）。
       本地失败**不**记（本地有真探活，失败通常是一次性算力/显存问题，记了反而误导）。 */
    if (body.use_cloud) {
      try { window.localStorage && window.localStorage.setItem('gt_cloud_lastfail', JSON.stringify({ t: Date.now(), msg: _msg.slice(0, 120) })); } catch (e2) {}
      gtRenderPlatformNote();
    }
  });
}

/* 生成结果对比器：原图 vs 生成图（Hover 位置分区左原右生） */
var GT_CMP_SEQ = 0;
function genCmpBuild(origUrl, genUrl) {
  var id = 'gt-cmp-' + (++GT_CMP_SEQ);
  var h = '<div class="gt-cmp" id="' + id + '">'
    + '<img class="gt-cmp-base" src="' + genUrl + '">'
    + '<div class="gt-cmp-top"><img src="' + origUrl + '"></div>'
    + '<div class="gt-cmp-line"></div>'
    + '<span class="gt-cmp-tag t-orig">原图</span>'
    + '<span class="gt-cmp-tag t-gen">生成图</span>'
    + '<span class="gt-cmp-hint">← 移动鼠标分区对比 原图/生成图 →</span>'
    + '</div>';
  setTimeout(function () { genCmpWire(id); }, 0);
  return h;
}
function genCmpWire(id) {
  var box = document.getElementById(id); if (!box) return;
  var top = box.querySelector('.gt-cmp-top'), line = box.querySelector('.gt-cmp-line');
  function setP(p) {
    p = Math.max(0, Math.min(100, p));
    if (top) top.style.clipPath = 'inset(0 ' + (100 - p) + '% 0 0)';
    if (line) line.style.left = p + '%';
  }
  box.addEventListener('mousemove', function (ev) {
    var r = box.getBoundingClientRect();
    setP(((ev.clientX - r.left) / r.width) * 100);
  });
  box.addEventListener('mouseleave', function () { setP(50); });
  setP(50);
}

/* 保存生图产物到素材库（复用后端入库：产物已在 output/，登记为素材条目） */
function gtCopyAsset(rel, wfType) {
  toast('产物已登记到素材库（' + wfType + '）：' + rel, 'ok');
}
